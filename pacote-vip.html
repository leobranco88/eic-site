<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>EIC · Seu pacote de aulas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#16161A;--ink2:#5A5A62;--ink3:#9A9AA2;--rule:#DDDDE0;--coral:#D9400B}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;color:var(--ink);background:#fff;line-height:1.4;font-feature-settings:'cv11','ss03'}
.w{max-width:560px;margin:0 auto;padding:36px 22px 60px}
h1{font-weight:800;font-size:clamp(34px,9vw,46px);letter-spacing:-.03em;line-height:1.02;margin:24px 0 8px}
.sub{color:var(--ink2);font-size:15px;border-bottom:1.5px solid var(--ink);padding-bottom:18px}
.logo{display:block;height:46px;width:auto}
.l{display:grid;grid-template-columns:70px 1fr auto;gap:16px;align-items:center;padding:14px 0;border-bottom:1px solid #EDEDEF}
.db{text-align:center;line-height:1}
.db i{display:block;font-style:normal;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);font-weight:600;margin-bottom:4px}
.db b{display:block;font-weight:800;font-size:38px;letter-spacing:-.04em}
.db small{display:block;font-size:12px;letter-spacing:.12em;font-weight:700;text-transform:uppercase;margin-top:4px}
.db.nd b{font-size:30px;color:var(--ink3)}
.d b{display:block;font-size:16px;font-weight:700;letter-spacing:-.01em}.d span{font-size:13px;color:var(--ink2)}
.t{font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;padding:5px 9px;border-radius:2px;white-space:nowrap}
.dada .t{background:#E5F2EA;color:#1D5233}.dada .db b,.dada .db small{color:#2A7D4B}
.agendada .t{background:#E6EEF8;color:#1B4A82}.agendada .db small{color:#1B4A82}
.pendente .t{background:#FBE4E1;color:#8A1F17}.pendente .db b{color:var(--ink3);text-decoration:line-through}.pendente .db small{color:#8A1F17}
.amarcar .t{background:#F6F6F4;color:var(--ink3)}.amarcar .db b{color:var(--ink3)}
.perdida .t{background:#F3E4E2;color:#8A1F17}.perdida .db b{text-decoration:line-through;color:var(--ink3)}.perdida .db small{color:#8A1F17}
.foot{margin-top:26px;font-size:13px;color:var(--ink2)}
.err{padding:60px 0}.err h1{font-size:30px}
</style>
</head>
<body>
<div class="w" id="app"></div>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DS=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'],MS=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'],pad=n=>String(n).padStart(2,'0');
const fmt=d=>d.split('-').reverse().slice(0,2).join('/');
function ler(){
  try{
    let b=location.hash.slice(1).replace(/-/g,'+').replace(/_/g,'/'); while(b.length%4) b+='=';
    const o=JSON.parse(decodeURIComponent(escape(atob(b))));
    return o&&Array.isArray(o.l)?o:null;
  }catch(_){ return null; }
}
const T={dada:'Aula dada',agendada:'Agendada',pendente:'Reposição a combinar',amarcar:'A marcar',perdida:'Sem reposição'};
const o=ler(), app=document.getElementById('app');
if(!o){
  app.innerHTML='<img class="logo" src="images/logo-eic.png" alt="EIC · Escola de Idiomas e Cultura"><div class="err"><h1>Não consegui abrir este calendário.</h1><p class="sub" style="border:0">Peça à secretaria da EIC para enviar o link de novo.</p></div>';
} else {
  const feitas=o.l.filter(x=>x.s==='dada').length;
  app.innerHTML=`<img class="logo" src="images/logo-eic.png" alt="EIC · Escola de Idiomas e Cultura">
  <h1>Olá, ${esc(o.a)}.<br>Seu pacote de ${o.t} aulas.</h1>
  <p class="sub">Professor${o.p?': '+esc(o.p):''} · ${feitas} de ${o.t} aulas dadas</p>
  ${o.l.map(x=>{
    const dt=x.d?new Date(x.d+'T12:00:00'):null, ev=x.s==='pendente'||x.s==='perdida';
    const bloco=dt?`<div class="db"><i>${DS[dt.getDay()]}</i><b>${pad(dt.getDate())}</b><small>${MS[dt.getMonth()]}</small></div>`:`<div class="db nd"><b>${x.n}</b><small>Aula</small></div>`;
    const linha=ev?(x.s==='pendente'?'Reposição a combinar':'Sem reposição'):(dt?(x.h?'às '+esc(x.h):'Horário a combinar'):'Data a combinar');
    const sub=x.r?'Reposição':ev?'Aula cancelada':x.s==='dada'?'Aula '+x.n+' de '+o.t+', dada':x.s==='agendada'?'Aula '+x.n+' de '+o.t:T[x.s]||'';
    return `<div class="l ${esc(x.s)}">${bloco}<div class="d"><b>${linha}</b><span>${sub}</span></div><div class="t">${x.s==='dada'?'Dada':x.s==='agendada'?(x.r?'Reposição':'Marcada'):x.s==='pendente'?'A repor':x.s==='perdida'?'Perdida':'A marcar'}</div></div>`;
  }).join('')}
  <p class="foot">Atualizado em ${o.u?fmt(o.u)+'/'+o.u.slice(0,4):''}. Se algo mudar, a secretaria envia um link novo.</p>`;
}
</script>
</body>
</html>
