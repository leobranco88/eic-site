    <div class="mf"><button class="vb" data-a="v-copy" data-k="${k.id}">Copiar link do aluno</button><button class="vb dk" data-a="v-ed-ok" data-k="${k.id}">${ico('disco')}Salvar</button></div>`;
}
function renderModal(){
  const m = $('#modal'); if(!m) return;
  if(!S.pc){ m.innerHTML = ''; document.body.style.overflow = ''; return; }
  const h = S.pc.mode === 'pick' ? vPick() : S.pc.mode === 'edit' ? vEdit() : vCard();
  if(!h){ S.pc = null; m.innerHTML = ''; return; }

  m.innerHTML = `<div class="mwrap" data-a="v-fechar"><div class="mc" role="dialog" aria-modal="true">${h}</div></div>`;
  m.firstChild.scrollTop = top; document.body.style.overflow = 'hidden';
}

async function vipClick(a, el, e){
  const k = el.dataset.k ? pkOf(el.dataset.k) : (S.pc ? pkOf(S.pc.k) : null), n = el.dataset.n ? +el.dataset.n : (S.pc && S.pc.n);
  const aula = k && n ? k.aulas.find(x => x.n === n) : null;
  const salva = msg => persist(() => pkSave(k), msg);
  if(a === 'v-fechar'){ if(e.target !== el) return; S.pc = null; return render(); }
  if(a === 'v-x'){ S.pc = null; return render(); }
  if(a === 'v-f'){ S.pkf = el.dataset.f; return render(); }
  if(a === 'v-novo'){ S.pf = pfNovo(); S.pc = null; render(); return window.scrollTo({top:0}); }
  if(a === 'v-aula'){ S.pc = {mode:'card', k:k.id, n:aula.n}; return render(); }
  if(a === 'v-ir'){ S.view = 'vip'; S.pf = null; await vipLoad(); S.pc = {mode:'card', k:el.dataset.k, n:+el.dataset.n}; return render(); }
  if(a === 'v-link'){ waOpen(k, vMsg(k)); return; }
  if(a === 'v-copy'){ try { await navigator.clipboard.writeText(vLink(k)); toast('Link copiado. É só colar no WhatsApp.'); } catch(_) { toast('Não consegui copiar. Use o botão do WhatsApp.', true); } return; }
  if(a === 'v-del'){
    const idx = S.pk.indexOf(k); S.pk.splice(idx, 1); render(); persist(() => S.store.del('pk', k.id));
    return toastUndo(`Pacote de ${k.aluno} excluído`, async () => { S.pk.splice(idx, 0, k); render(); await persist(() => pkSave(k)); });
  }
  if(a === 'v-edit'){ S.pc = {mode:'edit', k:k.id, tmp:{aluno:k.aluno, tel:k.tel || '', profId:k.profId, obs:k.obs || ''}}; return render(); }
  if(a === 'v-ed-prof'){ S.pc.tmp.profId = el.dataset.p; return render(); }
  if(a === 'v-ed-ok'){
    const t = S.pc.tmp; if(!t.aluno.trim()) return toast('O pacote precisa de um nome de aluno.', true);
    const antes = k.profId; k.aluno = t.aluno.trim(); k.tel = t.tel.trim(); k.profId = t.profId; k.obs = t.obs.trim();
    S.pc = null; render(); return salva('Pacote atualizado');
  }
  if(a === 'v-renovar'){
    const ult = k.aulas.map(x => x.data).filter(Boolean).sort().pop() || hojeStr(), dias = [...new Set(k.aulas.filter(x => x.data).map(x => parse(x.data).getDay()))];
    const base = k.aulas.find(x => x.data) || {};
    S.pf = pfNovo({step:2, aluno:k.aluno, tel:k.tel || '', profId:k.profId, total:k.total, dias, hora:base.inicio || '', dur:k.dur || 60, ini:addDays(ult, 1)}); S.pc = null; render(); return window.scrollTo({top:0});
  }
  /* ---- assistente ---- */
  if(a === 'v-pf-cancel'){ S.pf = null; return render(); }
  if(a === 'v-pf-back'){ S.pf.step--; return render(); }
  if(a === 'v-pf-prof'){ S.pf.profId = el.dataset.p; return render(); }
  if(a === 'v-pf-total'){ S.pf.total = +el.dataset.t; return render(); }
  if(a === 'v-pf-dur'){ S.pf.dur = +el.dataset.n; return render(); }
  if(a === 'v-pf-dia'){ const d = +el.dataset.d, l = S.pf.dias; S.pf.dias = l.includes(d) ? l.filter(x => x !== d) : l.concat(d).sort(); return render(); }
  if(a === 'v-pf-edit'){ const i = +el.dataset.i; if(S.pf.edit === i){ S.pf.edit = null; S.pf.datas.sort((x, y) => (x.d + x.inicio).localeCompare(y.d + y.inicio)); } else S.pf.edit = i; return render(); }
  if(a === 'v-pf-next'){
    const f = S.pf;
    if(f.step === 1){ if(!f.aluno.trim()) return toast('Escreva o nome do aluno.', true); if(!f.profId) return toast('Escolha o professor.', true); f.step = 2; return render(); }
    if(f.step === 2){
      if(!f.dias.length) return toast('Escolha pelo menos um dia da semana.', true);
      if(!f.hora) return toast('Informe o horário de início.', true);
      if(!f.ini) return toast('Informe a data da primeira aula.', true);
      el.disabled = true; await pfGerar(); f.step = 3; f.edit = null; return render();
    }
  }
  if(a === 'v-pf-criar'){
    const f = S.pf; if(f.datas.some((x, i) => !pfCheck(f, i).ok)) return toast('Alguma data tem conflito.', true);
    const ord = f.datas.slice().sort((x, y) => (x.d + x.inicio).localeCompare(y.d + y.inicio));
    const nk = {id:uid(), aluno:f.aluno.trim(), tel:f.tel.trim(), profId:f.profId, total:f.total, dur:f.dur, obs:'', prazo:null, criadoEm:new Date().toISOString(), criadoPor:S.user || '',
      aulas:ord.map((x, i) => ({n:i + 1, data:x.d, inicio:x.inicio, fim:x.fim, cancel:null, nota:'', rep:null}))};
    S.pk.push(nk); f.done = nk.id; f.step = 4; render(); window.scrollTo({top:0});
    return persist(() => pkSave(nk), 'Pacote criado');
  }
  /* ---- cartão da aula ---- */
  if(a === 'v-est' && aula){
    const est = el.dataset.e, e = pkEstado(k, aula), rep = e.rep;
    if(est === 'dada' || est === 'cancelada'){
      if(est === 'dada' && !aula.data) return toast('Marque primeiro a data da aula.', true);
      if(est === 'cancelada' && !aula.data) return toast('Essa aula ainda não tem data.', true);
      if((e.st === est) || (est === 'cancelada' && e.st === 'perdida')) return;
      await pkSetReg(k, aula, rep, est);
      if(est === 'cancelada' && !aula.cancel) aula.cancel = {quem:'aluno', motivo:'', aviso:'', direito:'sim', por:S.user || '', em:new Date().toISOString()};
      if(est === 'cancelada' && rep) { /* segunda falta na reposição */ }
    } else if(est === 'agendada'){
      if(e.st === 'agendada') return;
      if(e.st === 'amarcar') return toast('Use "Escolher data" para marcar essa aula.', true);
      if(rep) await pkSetReg(k, aula, true, null);
      else { await pkSetReg(k, aula, false, null); aula.cancel = null; aula.rep = null; }
    } else if(est === 'amarcar'){
      if(e.st === 'amarcar') return;
      if((aula.data && fechado(aula.data)) || (aula.rep && fechado(aula.rep.data))) return toast('Dia fechado. Reabra para editar.', true);
      await pkSetReg(k, aula, false, null); if(aula.rep) await pkSetReg(k, aula, true, null);
      aula.data = null; aula.inicio = aula.inicio; aula.rep = null; aula.cancel = null;
    }
    render(); return salva();
  }
  if(a === 'v-quem' && aula){ aula.cancel.quem = el.dataset.v; render(); return salva(); }
  if(a === 'v-mot' && aula){ aula.cancel.motivo = aula.cancel.motivo === el.dataset.v ? '' : el.dataset.v; render(); return salva(); }
  if(a === 'v-aviso' && aula){
    aula.cancel.aviso = aula.cancel.aviso === el.dataset.v ? '' : el.dataset.v;
    if(aula.cancel.aviso === 'menos' && aula.cancel.quem === 'aluno') aula.cancel.direito = 'nao'; else if(aula.cancel.aviso === 'mais' && aula.cancel.direito === 'nao') aula.cancel.direito = 'sim';
    render(); return salva();
  }
  if(a === 'v-dir' && aula){ aula.cancel.direito = el.dataset.v; render(); return salva(); }
  if(a === 'v-salvar' && aula){
    const t = S.pc.tmp; if(t && t.nota !== undefined) aula.nota = t.nota.trim();
    S.pc = null; render(); return salva('Aula salva');
  }
  if(a === 'v-avisar' && aula){
    const e = pkEstado(k, aula); waOpen(k, e.rep && e.st === 'agendada' ? vMsg(k, aula, 'rep') : (e.o ? vMsg(k, aula, 'canc') : (aula.data ? vMsg(k, aula, 'move') : vMsg(k)))); return;
  }
  /* ---- escolha de horário ---- */
  if((a === 'v-rep' || a === 'v-pick') && aula){
    const e = pkEstado(k, aula), kind = (e.st === 'cancelada' || (e.o && e.st === 'agendada')) ? 'rep' : 'move';
    S.pc = {mode:'pick', k:k.id, n:aula.n, kind, sel:null, mais:14, od:'', wa:!!k.tel};
    await loadRange(hojeStr(), addDays(hojeStr(), 14)); if(kind === 'rep'){ const pz = pkPrazo(k); if(pz && pz > hojeStr()) await loadRange(hojeStr(), pz < addDays(hojeStr(), 14) ? pz : addDays(hojeStr(), 14)); }
    return render();
  }
  if(a === 'v-pk-voltar'){ S.pc = {mode:'card', k:S.pc.k, n:S.pc.n}; return render(); }
  if(a === 'v-pk-h'){ S.pc.sel = {d:el.dataset.d, h:el.dataset.h}; return render(); }
  if(a === 'v-pk-wa'){ S.pc.wa = !S.pc.wa; return render(); }
  if(a === 'v-pk-mais'){ S.pc.mais += 14; await loadRange(hojeStr(), addDays(hojeStr(), S.pc.mais)); return render(); }
  if(a === 'v-pk-ok'){
    const c = S.pc, kk = pkOf(c.k), au = kk.aulas.find(x => x.n === c.n), sel = c.sel; if(!sel) return;
    const dur = au.inicio && au.fim ? toMin(au.fim) - toMin(au.inicio) : (kk.dur || 60), fim = fmtMin(toMin(sel.h) + dur);
    if(c.kind === 'rep') au.rep = {data:sel.d, inicio:sel.h, fim}; else { au.data = sel.d; au.inicio = sel.h; au.fim = fim; }
    const url = c.wa ? waUrl(kk, vMsg(kk, au, c.kind === 'rep' ? 'rep' : 'move')) : null;
    if(url) window.open(url, '_blank', 'noopener');
    S.pc = null; render();
    return persist(() => pkSave(kk), c.kind === 'rep' ? `Reposição marcada para ${dmy(sel.d)} às ${sel.h}` : `Aula ${au.n} marcada para ${dmy(sel.d)} às ${sel.h}`);
  }
}

async function persist(fn, okMsg){
  try { await fn(); if(okMsg) toast(okMsg); }
  catch(e){ console.error(e); toast('Não consegui salvar. Confira a conexão e tente de novo.', true); }
}

async function setStatus(slotId, st){
  const s = slotsOn(S.date).find(x => x.id === slotId); if(!s) return;
  const id = regId(S.date, slotId), cur = S.regs[id];
  const volta = async () => { if(cur){ S.regs[id] = cur; render(); await persist(() => S.store.put('regs', cur)); } else { delete S.regs[id]; render(); await persist(() => S.store.del('regs', id)); } };
  if(cur && cur.status === st){
    delete S.regs[id]; pkLimpaRep(s, S.date); render();
    toastUndo('Marcação removida', volta);
    return persist(() => S.store.del('regs', id));
  }
  const reg = {id, data:S.date, slotId, turmaId:s.turmaId, profId:s.profId, titulo:s.titulo, inicio:s.inicio, fim:s.fim,
               minutos:toMin(s.fim)-toMin(s.inicio), status:st, substitutoId:null, motivo:null};
  S.regs[id] = reg; pkLimpaRep(s, S.date); render();
  if(cur) toastUndo('Situação da aula alterada', volta);
  persist(() => S.store.put('regs', reg));
}

function keepAll(){ const i = $('#a-ini'); if(i) S.allTmp = {i:i.value, f:$('#a-fim').value, n:$('#a-nota').value}; return S.allSel || (S.allSel = new Set(activeProfs().map(x => x.id))); }
async function onClick(e){
  const el = e.target.closest('[data-a]'); if(!el) return;
  const a = el.dataset.a;
  if(a.startsWith('q-')) return quemClick(a, el);
  if(a === 'trocar') return trocarPessoa();
  if(a.startsWith('v-')) return vipClick(a, el, e);
  if(S.view === 'dia' && ['status','motivo','alldone','xopen','xsave','xdel','excl','desfaz','aopen','asave'].includes(a) && fechado(S.date)) return toast('Dia fechado. Reabra para editar.', true);
  if(el.tagName === 'SELECT') return;
  if(a === 'tab'){ S.view = el.dataset.v; S.openExtra = null; S.openAll = false; if(S.view==='mes' || S.view==='conf'){ S.cfConf = null; await ensureMonth(S.month); } if(S.view==='cp'){ S.cpT = null; S.cpK = null; await ensureRange(); } if(S.view==='turmas') await ensureRange(); if(S.view==='vip'){ S.pf = null; S.pc = null; await vipLoad(); } if(S.view==='agenda'){ await agCarrega(); S.ag.ini = segunda(S.date); S.ag.qd = S.date; await agCarrega(); } render(); }
  else if(a === 'logout'){ if(S.demo) location.href = location.pathname; else firebase.auth().signOut(); }
  else if(a === 'day') await goDate(ymd(new Date(parse(S.date).getTime() + el.dataset.n*864e5)));
  else if(a === 'today') await goDate(ymd(new Date()));
  else if(a === 'status') setStatus(el.dataset.slot, el.dataset.st);
  else if(a === 'excl'){
    const sl = slotsOn(S.date).find(x => x.id === el.dataset.slot); if(!sl || sl.pk) return;
    const antes = S.regs[regId(S.date, sl.id)];
    const reg = {id:regId(S.date, sl.id), data:S.date, slotId:sl.id, turmaId:sl.turmaId, profId:sl.profId, titulo:sl.titulo, inicio:sl.inicio, fim:sl.fim, minutos:0, status:'removida', substitutoId:null, motivo:null};
    S.regs[reg.id] = reg; render(); persist(() => S.store.put('regs', reg));
    toastUndo('Aula excluída só deste dia', async () => { if(antes){ S.regs[reg.id] = antes; render(); await persist(() => S.store.put('regs', antes)); } else { delete S.regs[reg.id]; render(); await persist(() => S.store.del('regs', reg.id)); } });
  }
  else if(a === 'desfaz'){ const id = regId(S.date, el.dataset.slot); delete S.regs[id]; render(); persist(() => S.store.del('regs', id)); }
  else if(a === 'cal'){ const [y, m] = (S.calMonth || S.date.slice(0,7)).split('-').map(Number); const d = new Date(y, m - 1 + +el.dataset.n, 1); S.calMonth = `${d.getFullYear()}-${pad(d.getMonth()+1)}`; await ensureMonth(S.calMonth); render(); }
  else if(a === 'calday') await goDate(el.dataset.d);
  else if(a === 'cano'){ keepCal(); S.calAno += +el.dataset.n; render(); }
  else if(a === 'ctipo'){ keepCal().tipo = el.dataset.t; render(); }
  else if(a === 'cday2'){ const f = keepCal(); f.id = null; f.de = el.dataset.d; f.ate = ''; render(); $('#c-nome').focus(); }
  else if(a === 'cedit'){ const e = S.cal.find(x => x.id === el.dataset.id); S.cf = {id:e.id, tipo:e.tipo, nome:e.nome, de:e.de, ate:e.ate && e.ate !== e.de ? e.ate : ''}; render(); window.scrollTo({top:0, behavior:'smooth'}); }
  else if(a === 'csave'){
    const f = keepCal(), nome = f.nome.trim();
    if(!nome || !f.de) return toast('Informe o nome e a data.', true);
    if(f.ate && f.ate < f.de) return toast('A data final precisa ser depois da inicial.', true);
    const ev = {id:f.id || uid(), tipo:f.tipo, nome, de:f.de, ate:f.ate || f.de};
    S.cal = S.cal.filter(x => x.id !== ev.id).concat(ev); S.cf = {tipo:f.tipo, nome:'', de:'', ate:''}; S.calAno = Math.min(S.calAno, +ev.de.slice(0,4)); render();
    persist(() => S.store.put('cal', ev), 'Calendário atualizado');
  }
  else if(a === 'cdel'){
    const e = S.cal.find(x => x.id === el.dataset.id); if(!e) return;
    S.cal = S.cal.filter(x => x.id !== e.id); render(); persist(() => S.store.del('cal', e.id));
    toastUndo(`"${e.nome}" removido do calendário`, async () => { S.cal.push(e); render(); await persist(() => S.store.put('cal', e)); });
  }
  else if(a === 'csug'){
    const novos = sugestoes().filter(x => !S.cal.some(y => y.id === x.id)); S.cal = S.cal.concat(novos); render();
    persist(() => Promise.all(novos.map(x => S.store.put('cal', x))), `${novos.length} datas carregadas`);
  }
  else if(a === 'aopen'){ S.openAll = true; S.openExtra = null; S.allSel = null; S.allTmp = null; render(); }
  else if(a === 'aclose'){ S.openAll = false; render(); }
  else if(a === 'aall'){ const t = keepAll(); S.allSel = t.size === activeProfs().length ? new Set() : new Set(activeProfs().map(x => x.id)); render(); }
  else if(a === 'ap'){ const t = keepAll(); t.has(el.dataset.p) ? t.delete(el.dataset.p) : t.add(el.dataset.p); render(); }
  else if(a === 'atipo'){ keepAll(); S.extraTipo = el.dataset.t; render(); }
  else if(a === 'asave'){
    const ini = $('#a-ini').value, fim = $('#a-fim').value, nota = $('#a-nota').value.trim(), sel = [...(S.allSel || [])];
    if(!ini || !fim || toMin(fim) <= toMin(ini)) return toast('Informe início e fim (o fim precisa ser depois do início).', true);
    if(!sel.length) return toast('Marque pelo menos um professor.', true);
    if(S.extraTipo === 'outro' && !nota) return toast('Em "Outro", descreva a atividade na observação.', true);
    const grupo = uid(), novos = sel.map(pid => ({id:uid(), grupo, data:S.date, profId:pid, tipo:S.extraTipo, inicio:ini, fim, minutos:toMin(fim)-toMin(ini), nota}));
    novos.forEach(x => S.extras[x.id] = x); S.openAll = false; S.allSel = null; S.allTmp = null; render();
    persist(() => Promise.all(novos.map(x => S.store.put('extras', x))));
    toastUndo(`Lançado para ${novos.length} ${novos.length === 1 ? 'professor' : 'professores'}`, async () => { novos.forEach(x => delete S.extras[x.id]); render(); await persist(() => Promise.all(novos.map(x => S.store.del('extras', x.id)))); });
  }
  else if(a === 'undo'){ const f = S.undo; S.undo = null; $('#toast').className = ''; if(f) await f(); }
  else if(a === 'pkd'){ S.ag.pk.d = el.dataset.d; agPickQ(); render(); }
  else if(a === 'pkh'){ S.ag.pk.h = S.ag.pk.h === el.dataset.h ? '' : el.dataset.h; if(!S.ag.pk.d) S.ag.pk.d = hojeStr(); agPickQ(); render(); }
  else if(a === 'pkm'){ S.ag.pk.m = el.dataset.m; if(S.ag.pk.d && S.ag.pk.h) agPickQ(); render(); }
  else if(a === 'agprof'){ S.ag.profId = el.dataset.p; render(); }
  else if(a === 'agdur'){ S.ag.dur = +el.dataset.n; render(); }
  else if(a === 'agsem'){ S.ag.ini = +el.dataset.n ? addDays(S.ag.ini, 7 * el.dataset.n) : segunda(hojeStr()); await agCarrega(); render(); }
  else if(a === 'agcopy'){ try { await navigator.clipboard.writeText(agTexto()); toast('Copiado. É só colar no WhatsApp.'); } catch(_) { toast('Não consegui copiar. Selecione e copie manualmente.', true); } }
  else if(a === 'motivo'){ const r = S.regs[el.dataset.id]; r.motivo = r.motivo === el.dataset.m ? null : el.dataset.m; render(); persist(() => S.store.put('regs', r)); }
  else if(a === 'alldone'){
    const m = dayModel(S.date).find(x => x.p.id === el.dataset.p);
    const novos = m.slots.filter(x => !x.r).map(({s}) => ({id:regId(S.date, s.id), data:S.date, slotId:s.id, turmaId:s.turmaId, profId:s.profId, titulo:s.titulo, inicio:s.inicio, fim:s.fim, minutos:toMin(s.fim)-toMin(s.inicio), status:'dada', substitutoId:null, motivo:null}));
    novos.forEach(r => S.regs[r.id] = r); render();
    persist(() => Promise.all(novos.map(r => S.store.put('regs', r))), `${novos.length} aulas marcadas como dadas`);
  }
  else if(a === 'cf-fil'){ S.cfF = el.dataset.f; S.cfConf = null; render(); }
  else if(a === 'cf-nao'){ S.cfConf = null; render(); }
  else if(a === 'cf-ir'){ S.view = 'dia'; S.cfConf = null; await goDate(el.dataset.d); window.scrollTo({top:0}); }
  else if(a === 'cf-fechar'){
    const d = el.dataset.d;
    if(S.cfConf !== d){ S.cfConf = d; return render(); }
    S.cfConf = null;
    const mod = dayModel(d), novos = [];
    mod.forEach(m => m.slots.forEach(({s, r}) => { if(!r) novos.push({id:regId(d, s.id), data:d, slotId:s.id, turmaId:s.turmaId, profId:s.profId, titulo:s.titulo, inicio:s.inicio, fim:s.fim, minutos:toMin(s.fim)-toMin(s.inicio), status:'dada', substitutoId:null, motivo:null}); }));
    if(mod.reduce((n, m) => n + m.pending, 0) !== novos.length) return toast('Neste dia há aulas que precisam de conferência individual.', true);
    const antes = S.fech[d];

      novos.forEach(r => delete S.regs[r.id]);

  else if(a === 'cp-edit'){ const t = S.turmas.find(x => x.id === el.dataset.id); S.view = 'turmas'; S.tf = JSON.parse(JSON.stringify(t)); S.tf.fim = t.fim || ''; S.tf.aulasTotal = t.aulasTotal || ''; render(); window.scrollTo({top:0, behavior:'smooth'}); }

  else if(a === 'cp-voltar'){ S.cpT = null; S.cpK = null; render(); window.scrollTo({top:0}); }

  else if(a === 'xopen'){ S.openExtra = el.dataset.p; render(); }

    const f = {id:S.date, data:S.date, status:'fechado', fechadoPor:S.user || '', fechadoEm:new Date().toISOString(), resumo:{dadas, subs, canc, extrasMin:ex, totalMin:tot}};

  else if(a === 'ttroca'){ const t = S.turmas.find(x => x.id === el.dataset.id); S.trocaProf = t.id; S.trocaSel = t.profId; render(); }
  else if(a === 'tpno'){ S.trocaProf = null; render(); }
  else if(a === 'tpsave'){

    if(novo === t.profId) return render();

  }
  else if(a === 'kpick') $('#kfile').click();
  else if(a === 'icancel'){ S.imp = null; render(); }
  else if(a === 'iok'){
    const im = S.imp, escolhidas = im.linhas.filter(x => x.sel && x.profId);
    if(!escolhidas.length) return;
    const mapa = {};
    for(const c of im.candidatos){
      if(!c.criar || !escolhidas.some(x => x.profId === c.chave)) continue;
      const p = {id:uid(), nome:c.nome, ativo:true, kaits:c.kaitsNome}; mapa[c.chave] = p.id; S.profs.push(p);
      await persist(() => S.store.put('profs', p));
    }

    S.turmas.push(...novas); S.imp = null;
    await ensureRange(); render();
    persist(() => Promise.all(novas.map(t => S.store.put('turmas', t))), `${novas.length} turmas importadas`);
  }
  else if(a === 'tnova'){ S.tf = novaTurma(); render(); }
  else if(a === 'tedit'){ const t = S.turmas.find(x => x.id === el.dataset.id); S.tf = JSON.parse(JSON.stringify(t)); S.tf.fim = t.fim || ''; S.tf.aulasTotal = t.aulasTotal || ''; render(); window.scrollTo({top:0, behavior:'smooth'}); }

  else if(a === 'tsave'){

    if(f.fim && f.fim <= f.inicio) return toast('A previsão de término precisa ser depois do início.', true);

    S.turmas = S.turmas.filter(x => x.id !== t.id).concat(t); S.tf = null;

  else if(a === 'tclose'){

  }

function onInput(e){
  const el = e.target;
  if(el.dataset.vf !== undefined && S.pf){ S.pf[el.dataset.vf] = el.value; return; }
  if(el.dataset.vc !== undefined && S.pc){ (S.pc.tmp = S.pc.tmp || {})[el.dataset.vc] = el.value; return; }
  if(el.id === 'v-q'){ S.pkq = el.value; const l = $('#vlist'); if(l) l.innerHTML = vLista(); return; }
  if(el.id === 'ag-busca'){ S.ag.q = el.value; if(S.ag.pk) S.ag.pk = {d:'', h:'', m:'00'}; agBuscaHtml().then(h => { const r = $('#ag-res'); if(r) r.innerHTML = h; }); return; }
  if(!S.tf) return;
  if(el.dataset.f){ S.tf[el.dataset.f] = el.value; }
  else if(el.dataset.h !== undefined){ S.tf.horarios[+el.dataset.h][el.dataset.k] = el.dataset.k === 'dia' ? +el.value : el.value; }
  else return;
  const c = $('#calc'); if(c) c.textContent = calcMsg(S.tf);
}

async function onChange(e){
  const el = e.target;
  if(el.id === 'seedfile'){
    const f = el.files && el.files[0]; el.value = ''; if(!f) return;
    let d; try{ d = JSON.parse(await f.text()); }catch(_){ return toast('Não consegui ler esse arquivo.', true); }
    if(!d || !Array.isArray(d.profs) || !Array.isArray(d.turmas)) return toast('Esse arquivo não parece ser o de dados iniciais.', true);
    if(S.profs.length || S.turmas.length) return toast('O sistema já tem dados. A carga inicial só vale para um sistema vazio.', true);
    const cal = Array.isArray(d.cal) ? d.cal : [], cl = x => JSON.parse(JSON.stringify(x));
    d.profs.forEach(x => S.profs.push(x)); d.turmas.forEach(x => S.turmas.push(x)); cal.forEach(x => S.cal.push(x));
    render();
    return persist(() => Promise.all([...d.profs.map(x => S.store.put('profs', cl(x))), ...d.turmas.map(x => S.store.put('turmas', cl(x))), ...cal.map(x => S.store.put('cal', cl(x)))]), `${d.turmas.length} turmas, ${d.profs.length} professores e ${cal.length} datas do calendário carregados`);
  }
  if(el.dataset.vd !== undefined && S.pf){
    const x = S.pf.datas[+el.dataset.vd]; if(!el.value) return;
    x[el.dataset.vk] = el.value; if(el.dataset.vk === 'd') await ensureMonth(el.value.slice(0,7));
    x.fim = fmtMin(toMin(x.inicio) + S.pf.dur); return render();
  }
  if(el.id === 'v-od' && S.pc){ S.pc.od = el.value; if(el.value){ await ensureMonth(el.value.slice(0,7)); S.pc.sel = null; } return render(); }
  if(el.id === 'v-prazo'){ const k = pkOf(el.dataset.k); k.prazo = el.value || null; render(); return persist(() => pkSave(k), 'Prazo atualizado'); }
  if(el.id === 'pk-date'){ if(!el.value) return; S.ag.pk.d = el.value; agPickQ(); await ensureMonth(el.value.slice(0,7)); return render(); }
  if(el.id === 'ag-qd' || el.id === 'ag-qh'){ if(!el.value) return; S.ag[el.id === 'ag-qd' ? 'qd' : 'qh'] = el.value; await agCarrega(); return render(); }
  if(el.id === 'kfile' && el.files[0]){
    const arq = el.files[0], txt = await arq.text(); el.value = '';
    const itens = parseKaits(txt);
    if(!itens.length) return toast('Não reconheci esse arquivo. Use o relatório "consolidado turmas" do Kaits.', true);
    S.imp = montarImportacao(itens, arq.name); S.tf = null; S.view = 'turmas'; await ensureRange(); render(); window.scrollTo({top:0, behavior:'smooth'}); return;
  }
  if(S.imp && el.dataset.ip !== undefined){ const x = S.imp.linhas[+el.dataset.ip]; x.profId = el.value; x.manual = true; x.sel = !!el.value && !x.dup; if(el.value) x.aviso = ''; return render(); }
  if(S.imp && el.dataset.ic !== undefined){ S.imp.linhas[+el.dataset.ic].sel = el.checked; return render(); }
  if(S.imp && el.dataset.icand !== undefined){
    const c = S.imp.candidatos[+el.dataset.icand]; c.criar = el.checked;
    S.imp.linhas.forEach(x => { if(x.manual && x.profId === c.chave && !c.criar){ x.manual = false; } });
    resolver(S.imp); return render();
  }
  if(el.dataset.tp){ S.trocaSel = el.value; return; }
  if(el.id === 'fprof'){ S.fProf = el.value; return render(); }
  if(el.id === 'foto' && el.files[0]){
    try { const p = prof(S.selProf); p.foto = await fotoQuadrada(el.files[0]); el.value = ''; render(); persist(() => S.store.put('profs', p), 'Foto salva'); }
    catch(err){ toast('Não consegui ler essa imagem. Tente um JPG ou PNG.', true); }
    return;
  }
  if(el.id === 'pickday' && el.value) return goDate(el.value);
  if(el.id === 'pickmonth' && el.value){ S.month = el.value; S.openDetail = null; await ensureMonth(S.month); return render(); }
  if(el.dataset.a === 'subsel'){
    if(fechado(S.date)) return toast('Dia fechado. Reabra para editar.', true);
    const r = S.regs[el.dataset.id]; r.substitutoId = el.value || null; render();
    persist(() => S.store.put('regs', r), r.substitutoId ? 'Substituição registrada' : '');
  }
}

async function goDate(d){ S.date = d; S.calMonth = d.slice(0,7); S.openExtra = null; await ensureMonth(d.slice(0,7)); render(); }

function csv(){
  const rows = monthTotals(S.month);
  const n = m => (m/60).toFixed(2).replace('.', ',');
  const head = ['Professor','Aulas dadas (h)','Substituições (h)','Extras (h)','Total (h)','Canceladas (h)','Passou a outro (h)', ...TIPOS_EXTRA.map(t => t.nome + ' (h)')];
  const lines = [head, ...rows.map(t => [t.p.nome, n(t.dadas), n(t.cobriu), n(t.extras), n(t.dadas+t.cobriu+t.extras), n(t.canceladas), n(t.passou), ...TIPOS_EXTRA.map(x => n(t.porTipo[x.id]||0))])];
  const blob = new Blob(['﻿' + lines.map(l => l.map(c => `"${String(c).replace(/"/g,'""')}"`).join(';')).join('\r\n')], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `horas-professores-${S.month}.csv`; a.click();
}


/* =====================================================================
   QUEM ESTÁ USANDO + PRESENÇA
   Só a equipe administrativa (secretaria, direção), não os professores.
   O computador lembra a pessoa escolhida. Cada pessoa tem um registro em
   ponto_presenca atualizado a cada 45 s enquanto a aba está visível.
   ===================================================================== */
const PRES_MS = 120000;
const TINTS = [['#F7E3DA','#8A2A06'],['#E6EEF8','#1B4A82'],['#E5F2EA','#1D5233'],['#FBEFD5','#8A5200'],['#EFE6F5','#5B2D7A'],['#E4ECEE','#2E4A52']];
const tint = id => { const t = TINTS[[...String(id)].reduce((a, c) => a + c.charCodeAt(0), 0) % TINTS.length]; return `background:${t[0]};color:${t[1]}`; };
const telaLabel = () => S.view === 'dia' ? `Dia, ${dmy(S.date)}` : ({turmas:'Turmas', mes:'Mês', vip:'VIP', agenda:'Horários', cal:'Calendário', prof:'Professores'}[S.view] || '');
function presPing(force){
  if(!S.me || document.hidden) return;
  const t = telaLabel(), now = Date.now();
  if(!force && t === S.lastTela && now - (S.lastPing || 0) < 40000) return;
  S.lastTela = t; S.lastPing = now;
  Promise.resolve(S.store.ping(S.me.id, {nome:S.me.nome, em:new Date().toISOString(), tela:t})).catch(() => {});
}
function presStart(){
  presPing(true);
  if(S.presT) return;
  S.presT = setInterval(() => { presPing(true); renderPres(); }, 45000);
  S.store.watchPres(l => { S.pres = l; renderPres(); });
  document.addEventListener('visibilitychange', () => { if(!document.hidden) presPing(true); });
}
function renderPres(){
  const el = $('#pres'); if(!el || !S.me) return;
  const agora = Date.now();
  let at = S.pres.filter(x => x.em && agora - Date.parse(x.em) < PRES_MS);
  if(!at.some(x => x.id === S.me.id)) at.unshift({id:S.me.id, nome:S.me.nome, tela:telaLabel()});
  at.sort((a, b) => (a.id === S.me.id ? -1 : 0) - (b.id === S.me.id ? -1 : 0) || a.nome.localeCompare(b.nome, 'pt-BR'));
  const vis = at.slice(0, 4), extra = at.length - vis.length;
  el.innerHTML = `<span class="me">Você é <b>${esc(S.me.nome)}</b></span><div class="st">${vis.map(x => `<span class="m" style="${tint(x.id)}" title="${esc(x.nome)}">${esc(initials(x.nome))}</span>`).join('')}${extra > 0 ? `<span class="m mais">+${extra}</span>` : ''}</div>
    <div class="tip"><div class="h">Ativos agora</div>${at.map(x => `<div class="it"><span class="m2" style="${tint(x.id)}">${esc(initials(x.nome))}</span>${esc(x.nome)}${x.id === S.me.id ? ' (você)' : ''}<span class="t">${esc(x.id === S.me.id ? telaLabel() : (x.tela || ''))}</span></div>`).join('')}</div>`;
}
function renderQuem(){
  const agora = Date.now(), ativos = new Set(S.pres.filter(x => x.em && agora - Date.parse(x.em) < PRES_MS).map(x => x.id)), salvo = localStorage.getItem(S.store.meKey);
  const add = S.quemAdd || !S.eq.length;
  $('#quem').innerHTML = `<img class="logo-q" src="/images/logo-eic.png" alt="EIC · Escola de Idiomas e Cultura"><div class="br">Horas dos professores</div><h1>Quem está usando?</h1>
    <p class="qs">${S.eq.length ? 'Escolha seu nome para entrar. Quem já está no sistema aparece com o ponto verde.' : 'Ainda não há ninguém cadastrado. Adicione o primeiro nome da equipe.'}</p>
    <div class="qg">${S.eq.map(x => `<div class="qp ${ativos.has(x.id) ? 'use' : ''} ${salvo === x.id ? 'on' : ''}"><button class="qa" data-a="q-pick" data-id="${x.id}" style="${tint(x.id)}" aria-label="Entrar como ${esc(x.nome)}">${esc(initials(x.nome))}</button><div class="qn">${esc(x.nome)}</div><small>${ativos.has(x.id) ? 'usando agora' : (salvo === x.id ? 'neste computador' : '&nbsp;')}</small>${S.quemEdit ? `<button class="qx" data-a="q-del" data-id="${x.id}" aria-label="Remover ${esc(x.nome)}">×</button>` : ''}</div>`).join('')}
      <div class="qp"><button class="qa add" data-a="q-new" aria-label="Adicionar pessoa">+</button><div class="qn">Adicionar pessoa</div><small>&nbsp;</small></div></div>
    ${add ? `<div class="qadd"><input type="text" id="q-nome" placeholder="Nome (ex.: Ana)" autocomplete="off" maxlength="30"><button class="vb dk" data-a="q-add">Adicionar</button></div>` : ''}
    ${S.eq.length ? `<button class="qlink" data-a="q-edit">${S.quemEdit ? 'Pronto' : 'Editar equipe'}</button>` : ''}`;
  if(add){ const i = $('#q-nome'); if(i) i.focus(); }
}
async function showQuem(){
  try { S.pres = await S.store.getPres(); } catch(_) { S.pres = []; }
  S.quemEdit = false; S.quemAdd = false; renderQuem();
  $('#app').hidden = true; $('#quem').hidden = false;
}
function enter(me){
  S.me = me; S.user = me.nome; localStorage.setItem(S.store.meKey, me.id);
  $('#quem').hidden = true; $('#app').hidden = false; $('#whoami').textContent = me.nome;
  render(); renderPres(); presStart();
}
async function quemClick(a, el){
  if(a === 'q-pick'){ const x = S.eq.find(y => y.id === el.dataset.id); if(x) enter(x); return; }
  if(a === 'q-new'){ S.quemAdd = true; renderQuem(); return; }
  if(a === 'q-edit'){ S.quemEdit = !S.quemEdit; renderQuem(); return; }
  if(a === 'q-add'){
    const i = $('#q-nome'), nome = i ? i.value.trim() : ''; if(!nome) return toast('Escreva o nome.', true);
    if(S.eq.some(x => x.nome.toLowerCase() === nome.toLowerCase())) return toast('Esse nome já está na lista.', true);
    const x = {id:uid(), nome}; S.eq.push(x); S.quemAdd = false;
    await persist(() => S.store.put('eq', x)); return enter(x);
  }
  if(a === 'q-del'){
    const x = S.eq.find(y => y.id === el.dataset.id); if(!x) return;
    S.eq = S.eq.filter(y => y.id !== x.id); renderQuem(); persist(() => S.store.del('eq', x.id));
    toastUndo(`${x.nome} removido da equipe`, async () => { S.eq.push(x); renderQuem(); await persist(() => S.store.put('eq', x)); });
  }
}
async function trocarPessoa(){
  if(S.me){ const m = S.me; S.me = null; Promise.resolve(S.store.ping(m.id, {nome:m.nome, em:'', tela:''})).catch(() => {}); }
  await showQuem();
}

/* =====================================================================
   INÍCIO
   ===================================================================== */
async function start(){
  const data = await S.store.init();
  S.profs = data.profs; S.turmas = data.turmas; S.cal = data.cal || []; S.pk = data.pk || []; S.cp = {}; (data.cp || []).forEach(c => S.cp[c.id] = c); S.eq = data.eq || [];
  await vipLoad();
  await ensureMonth(S.date.slice(0,7));
  $('#login').hidden = true;
  const salvo = localStorage.getItem(S.store.meKey), eu = S.eq.find(x => x.id === salvo);
  if(eu) enter(eu); else await showQuem();
}

document.addEventListener('click', onClick);
document.addEventListener('change', onChange);
document.addEventListener('input', onInput);
document.addEventListener('keydown', e => { if(e.key === 'Escape' && S.pc){ S.pc = null; render(); } if(e.key === 'Enter' && e.target.id === 'q-nome') quemClick('q-add', e.target); });

function startDemo(){
  S.demo = true; S.user = 'Demonstração'; S.store = LocalStore(); $('#demo').hidden = false; $('#whoami').textContent = 'Demonstração';
  start();
}

if(typeof firebase === 'undefined'){
  /* Firebase não carregou (rede bloqueada ou sem internet) */
  $('#login').hidden = false;
  $('#lform').innerHTML = `<h2 style="font-family:var(--serif);font-size:28px;font-weight:800;line-height:1.1">Não consegui conectar ao banco de dados.</h2>
    <p style="margin-top:12px;color:var(--ink2)">Confira a internet e recarregue a página.</p>`;
} else {
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore(), auth = firebase.auth();
  S.store = FirestoreStore(db);
  $('#lform').addEventListener('submit', async e => {
    e.preventDefault(); $('#lerr').textContent = '';
    try { await auth.signInWithEmailAndPassword($('#le').value.trim(), $('#lp').value); }
    catch(err){ $('#lerr').textContent = 'E-mail ou senha incorretos.'; }
  });
  auth.onAuthStateChanged(async u => {
    if(!u){ S.me = null; $('#app').hidden = true; $('#quem').hidden = true; $('#login').hidden = false; return; }
    $('#whoami').textContent = u.email; S.user = u.email;
    try { await start(); } catch(e){ console.error(e); $('#login').hidden = false; $('#app').hidden = true; $('#lerr').textContent = 'Entrou, mas o banco recusou a leitura. As regras do Firestore precisam liberar as coleções ponto_.'; }
  });
}
</script>
