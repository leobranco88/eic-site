<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>EIC · Fechamento do dia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<style>
:root{
  --paper:#FFFFFF; --sheet:#F6F6F4; --ink:#16161A; --ink2:#5A5A62; --ink3:#9A9AA2;
  --rule:#DDDDE0; --rule2:#EDEDEF;
  --c-dada:#2A7D4B; --c-sub:#2563A8; --c-canc:#B42318; --pend:#C77700; --pend-bg:#FBEFD5; --coral:#D9400B; --coral-bg:#F7E3DA; --slate:#2E4A52;
  --serif:'Inter',system-ui,sans-serif; --sans:'Inter',system-ui,sans-serif; --mono:'Inter',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--paper)}
body{font-variant-numeric:tabular-nums;font-feature-settings:'cv11','ss03';font-family:var(--sans);color:var(--ink);font-size:15px;line-height:1.4;min-height:100vh}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select{font:inherit;color:inherit}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
[hidden]{display:none!important}

/* ---------- login ---------- */
#login{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
#login .l-left{background:var(--slate);color:#fff;padding:56px;display:flex;flex-direction:column;justify-content:space-between}
#login .l-left h1{font-family:var(--serif);font-weight:800;font-size:clamp(44px,6vw,84px);line-height:.98;letter-spacing:-.02em}
#login .l-left h1 em{font-weight:500;color:#F0B49C}
#login .l-left p{max-width:34ch;color:#C9D2D1;font-size:15px}
#login .l-right{display:flex;align-items:center;padding:56px}
#login form{width:100%;max-width:340px}
#login label{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);margin:18px 0 6px}
#login input{width:100%;padding:11px 0;border:0;border-bottom:1.5px solid var(--ink);background:transparent;outline:0;font-size:17px}
#login input:focus{border-bottom-color:var(--coral)}
.btn-main{margin-top:28px;background:var(--ink);color:var(--paper);padding:13px 22px;font-weight:600;border-radius:2px}
.btn-main:hover{background:var(--coral)}
#lerr{color:var(--coral);font-size:13px;margin-top:14px;min-height:18px}

/* ---------- shell ---------- */
#app{display:grid;grid-template-columns:300px 1fr;min-height:100vh}
aside{border-right:1px solid var(--rule);padding:28px 28px 36px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;overflow:auto}
.logo-l{display:block;width:210px;max-width:70%;height:auto;margin:0 0 40px}
.logo-s{display:block;width:150px;max-width:100%;height:auto;margin:0 0 8px}
.logo-q{display:block;width:200px;height:auto;margin:0 auto 22px}
.brand{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);font-weight:600}
.brand b{color:var(--coral)}
nav.tabs{display:flex;flex-wrap:wrap;gap:8px 12px;font-size:13px;margin:22px 0 34px;border-bottom:1px solid var(--rule)}
nav.tabs button{padding:0 0 10px;font-weight:500;color:var(--ink3);border-bottom:2px solid transparent;margin-bottom:-1px}
nav.tabs button.on{color:var(--ink);border-bottom-color:var(--ink)}
.bigday{font-family:var(--serif);font-weight:800;font-size:120px;line-height:.85;letter-spacing:-.06em}
.wk{font-weight:600;font-size:22px;margin-top:14px;letter-spacing:-.01em}
.mo{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);margin-top:4px}
.daynav{display:flex;gap:6px;margin:22px 0 0;align-items:center}
.daynav button{border:1px solid var(--rule);padding:7px 12px;border-radius:2px;font-size:14px;background:var(--sheet)}
.daynav button:hover{border-color:var(--ink)}
.daynav input{border:1px solid var(--rule);padding:6px 8px;border-radius:2px;background:var(--sheet);font-size:13px}
.cal{margin-top:22px}
.cal-h{display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:13px;margin-bottom:8px}
.cal-h button{font-size:18px;padding:0 8px;color:var(--ink2)}.cal-h button:hover{color:var(--ink)}
.cal-w,.cal-g{display:grid;grid-template-columns:repeat(7,1fr)}
.cal-w span{font-size:10px;letter-spacing:.08em;color:var(--ink3);text-align:center;padding-bottom:4px}
.cd{position:relative;height:32px;font-size:13px;font-family:var(--mono);color:var(--ink);border-radius:2px}
.cd:hover{background:var(--sheet)}.cd.out{color:var(--ink3);opacity:.55}
.cd.cl{background:repeating-linear-gradient(135deg,transparent 0 4px,var(--rule2) 4px 5px)}.cd.hoje{font-weight:700;color:var(--coral)}.cd.sel{background:var(--ink);color:var(--paper);opacity:1}
.cd i,.cal-k i{display:inline-block;width:5px;height:5px;border-radius:50%}
.cd i{position:absolute;left:50%;bottom:3px;margin-left:-2.5px}
i.ok{background:var(--c-dada)}.cal-k i.cl{width:9px;height:9px;border-radius:1px;background:repeating-linear-gradient(135deg,transparent 0 2px,var(--ink3) 2px 3px)}i.pd{background:var(--pend)}
.cal-k{display:flex;gap:14px;margin-top:8px;font-size:11px;color:var(--ink3)}.cal-k span{display:flex;align-items:center;gap:5px}
.exc{margin-left:6px;color:var(--ink3);padding:6px 8px;border:1px solid transparent}.exc:hover{color:var(--c-canc);border-color:var(--rule)}
.exc .ico{width:16px;height:16px}
.row.st-removida{opacity:.6}.row.st-removida .what{text-decoration:line-through;color:var(--ink3)}
.row.st-removida .time::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:7px;background:var(--rule)}
.conf{display:block;color:var(--coral);font-size:12.5px;margin-top:3px;font-weight:500}
.rem{font-size:13px;color:var(--ink3)}.rem button{text-decoration:underline;margin-left:10px;color:var(--ink2)}
.locked .exc{pointer-events:none;opacity:.5}
.ag-box{margin-top:26px;border-top:1px solid var(--ink);padding-top:12px}.ag-box h4{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2);margin-bottom:10px;font-weight:600}
.ag-q{display:flex;gap:6px}.ag-q input{border:1px solid var(--rule);padding:6px 4px;flex:1 1 0;width:0;border-radius:2px;background:var(--sheet);font-size:13px;min-width:0}
.ag-res{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 4px}.ag-res span{font-size:13px;padding:4px 10px;border-radius:2px;border:1px solid var(--rule)}
.ag-res .yes{background:#E1F0E7;color:#1D5233;border-color:#E1F0E7;font-weight:600}.ag-res .no{color:var(--ink3);text-decoration:line-through}
.ag-box small{font-size:12px;color:var(--ink3);line-height:1.4;display:block}
.ag-head{display:flex;align-items:baseline;justify-content:space-between;gap:20px;border-bottom:1px solid var(--ink);padding-bottom:12px}
.ag-head h2{font-family:var(--serif);font-weight:800;font-size:44px;letter-spacing:-.03em}
.ag-nav{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink2)}.ag-nav button{border:1px solid var(--rule);padding:6px 12px;border-radius:2px;background:var(--sheet)}.ag-nav button:hover{border-color:var(--ink)}
.ag-sub{font-size:13px;color:var(--ink3);margin:12px 0 6px}
.tl{position:relative;height:30px;background:var(--sheet);border:1px solid var(--rule2);border-radius:2px;margin-bottom:6px}
.tl i{position:absolute;top:0;bottom:0;border-left:1px solid var(--rule2)}.tl i u{position:absolute;top:32px;left:-4px;font-size:10px;color:var(--ink3);text-decoration:none;font-family:var(--mono)}
.blk{position:absolute;top:0;bottom:0;background:var(--slate);border-right:1px solid var(--paper);overflow:hidden;cursor:default}
.blk span{font-size:10px;color:#fff;font-family:var(--mono);padding:2px 4px;display:block}
.ag-free{display:flex;flex-wrap:wrap;gap:6px;margin-top:0}.ag-free span{font-family:var(--mono);font-size:13px;padding:3px 9px;background:#E1F0E7;color:#1D5233;border-radius:2px}
.ag-free b,.ag-res b{width:100%;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);font-weight:600;margin-bottom:-2px}.ag-free b{width:auto;align-self:center;margin:0 4px 0 0}
.ag-res em{font-size:13px;color:var(--ink3)}
.ag-leg{display:flex;gap:20px;flex-wrap:wrap;font-size:13px;color:var(--ink2);margin:14px 0 4px}.ag-leg span{display:flex;align-items:center;gap:7px}
.ag-leg i{display:inline-block;width:18px;height:10px;border-radius:2px}.ag-leg .o{background:var(--slate)}.ag-leg .x{background:var(--coral)}.blk.ext{background:var(--coral)}.ag-leg .l{background:#E1F0E7;border:1px solid #9CC8AC}
.ag-free em{font-size:13px;color:var(--ink3)}.ag-copy{margin-top:26px}
.allbar{margin-bottom:22px}.allf{margin-bottom:26px}
.locked .allbar{display:none}
.ag-day{margin-top:14px;border:1px solid var(--rule2);border-radius:2px;padding-bottom:30px;position:relative}
.ag-day.past{opacity:.45}
.ag-dh{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:10px 16px;background:var(--sheet);margin-bottom:14px;flex-wrap:wrap}
.ag-day:has(.ag-closed){padding-bottom:0}.ag-day:has(.ag-closed) .ag-dh{margin-bottom:0}
.dn{font-size:19px;font-weight:600;color:var(--ink2);letter-spacing:-.01em}.dn b{font-family:var(--serif);font-weight:800;font-size:28px;letter-spacing:-.03em;color:var(--ink);margin-left:4px}
.dn i{font-style:normal;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--coral);margin-left:10px;font-weight:700}
.ag-day.today .dn b,.ag-day.today .dn{color:var(--coral)}
.ag-closed{font-size:14px;color:var(--ink2)}
.ag-day .tl{margin:0 16px}.ag-day .tl i u{top:32px}
.semaula{margin-bottom:22px;padding:12px 16px;background:var(--sheet);border-left:3px solid var(--coral);font-size:14.5px;color:var(--ink2)}.semaula b{color:var(--ink)}
.cform label{display:block;font-size:12px;color:var(--ink2);margin:14px 0 5px}.cform input{border:1px solid var(--rule);padding:7px 8px;border-radius:2px;background:var(--sheet);font-size:13px;width:100%;min-width:0}
.cform .ag-q{gap:8px}.cform .ag-q>div{flex:1;min-width:0}
.cleg{display:flex;flex-direction:column;gap:7px;font-size:13px;color:var(--ink2)}.cleg span{display:flex;align-items:center;gap:8px}.cleg i,.cev i{display:inline-block;width:10px;height:10px;border-radius:2px;flex:none}
.cano{margin-top:30px}.cano h3{font-family:var(--serif);font-weight:800;font-size:34px;letter-spacing:-.03em;border-bottom:1px solid var(--ink);padding-bottom:6px;margin-bottom:18px}
.cmeses{display:grid;grid-template-columns:repeat(4,1fr);gap:22px 20px}.cmes h5{font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;margin-bottom:6px}
.cw,.cg{display:grid;grid-template-columns:repeat(7,1fr)}.cw span{font-size:9px;color:var(--ink3);text-align:center;padding-bottom:2px}
.cdy{height:26px;font-size:11.5px;font-family:var(--mono);color:var(--ink);border-radius:2px;padding:0}.cdy:hover{outline:1px solid var(--ink)}.cdy.dom{color:var(--ink3)}
.cdy.ev{background:var(--c);color:#fff}.cdy.hoje{outline:2px solid var(--ink);font-weight:700}
.clista{margin-top:18px}.cev{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--rule2);font-size:14px}.cev .cd8{font-family:var(--mono);font-size:13px;color:var(--ink2);min-width:112px}.cev .cnm{flex:1}
.ag-find{position:relative;margin-bottom:26px}
.ag-find .lupa{position:absolute;left:16px;top:17px;color:var(--ink3)}.ag-find .lupa .ico{width:20px;height:20px}
.ag-find input{width:100%;border:1px solid var(--ink);border-radius:2px;padding:15px 16px 15px 46px;font-size:18px;background:var(--paper)}
.ag-or{margin:16px 0 10px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);font-weight:600}
.ag-pick .pk-l{font-size:12px;color:var(--ink2);margin:12px 0 6px;font-weight:600}.pk-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pk-d{display:flex;flex-direction:column;align-items:center;width:58px;padding:7px 0 6px;border:1px solid var(--rule);border-radius:2px;background:var(--paper)}
.pk-d small{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);line-height:1.2}.pk-d b{font-family:var(--serif);font-weight:800;font-size:22px;line-height:1.1;letter-spacing:-.03em}
.pk-d.hj small:first-child{color:var(--coral);font-weight:700}.pk-d.cl{background:repeating-linear-gradient(135deg,var(--paper) 0 4px,var(--rule2) 4px 5px)}
.pk-h,.pk-m{padding:9px 0;min-width:46px;border:1px solid var(--rule);border-radius:2px;background:var(--paper);font-size:14px;font-family:var(--mono)}.pk-m{min-width:44px;color:var(--ink2)}
.pk-sep{width:14px}.pk-od{display:flex;flex-direction:column;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);gap:4px}.pk-od input{border:1px solid var(--rule);padding:8px 8px;border-radius:2px;background:var(--paper);font-size:13px;text-transform:none;letter-spacing:0;color:var(--ink)}
.pk-d:hover,.pk-h:hover,.pk-m:hover{border-color:var(--ink)}
.pk-d.on,.pk-h.on,.pk-m.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}.pk-d.on small,.pk-d.on b{color:var(--paper)}
.ag-find input::placeholder{color:var(--ink3)}
.bq{margin-top:10px;padding:16px 18px;background:var(--sheet);border-left:4px solid var(--ink3);font-size:15px;color:var(--ink2)}
.bq em{font-style:normal;font-family:var(--mono);font-size:13px;background:var(--paper);padding:1px 6px}
.bq.ok{background:#E1F0E7;border-color:var(--c-dada);color:#1D5233}.bq.no{background:#FBE4E1;border-color:var(--c-canc);color:#7A1F17}
.bqh{display:flex;justify-content:space-between;align-items:baseline;gap:14px;flex-wrap:wrap;font-size:22px;font-weight:600;color:var(--ink)}.bqh b{font-weight:800}
.bqw{font-family:var(--mono);font-size:14px;font-weight:400;color:var(--ink2)}
.bqs{margin-top:8px;font-size:14px}.bq .ag-res .yes{background:#fff}
.tally{margin-top:28px;border-top:1px solid var(--ink);padding-top:14px}
.tally div{display:flex;justify-content:space-between;align-items:baseline;padding:7px 0;border-bottom:1px solid var(--rule2);font-size:14px;color:var(--ink2)}
.tally div b{font-family:var(--mono);font-weight:500;color:var(--ink);font-size:15px}
.tally .tot{border-bottom:0;padding-top:16px;color:var(--ink);font-weight:600}
.tally .tot b{font-size:28px;font-family:var(--serif);font-weight:800}
.pend{margin-top:18px;font-size:14px;padding:10px 12px;background:var(--pend-bg);color:#6B4100;border-left:3px solid var(--pend)}
.done{margin-top:18px;font-size:14px;padding:10px 12px;background:#E1F0E7;color:#1D5233;border-left:3px solid var(--c-dada)}
.who{margin-top:auto;padding-top:28px;font-size:12px;color:var(--ink3)}
.who button{color:var(--ink2);text-decoration:underline;margin-left:6px}
.demo{background:var(--ink);color:var(--paper);font-size:12px;letter-spacing:.04em;padding:7px 28px}

main{padding:36px 48px 80px;max-width:1040px}

/* ---------- day view ---------- */
.teacher{margin-bottom:46px}
.t-head{display:flex;align-items:center;gap:16px;border-bottom:1.5px solid var(--ink);padding-bottom:10px}
.t-name{font-family:var(--serif);font-weight:800;font-size:30px;letter-spacing:-.01em}
.t-sub{font-size:13px;color:var(--ink2)}
.t-total{margin-left:auto;text-align:right}
.t-total b{font-family:var(--mono);font-weight:500;font-size:22px}
.t-total span{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)}
.t-tools{display:flex;gap:18px;padding:10px 0 4px;font-size:13px}
.t-tools button{color:var(--ink2);text-decoration:underline;text-underline-offset:3px}
.t-tools button:hover{color:var(--coral)}
.row{display:grid;grid-template-columns:118px 1fr auto;gap:16px;align-items:center;padding:13px 0;border-bottom:1px solid var(--rule2)}
.row .time{font-family:var(--mono);font-size:14px;color:var(--ink2)}
.row .what{font-weight:500}
.row .what small{display:block;font-weight:400;color:var(--ink3);font-size:12.5px;margin-top:1px}
.row.pending .time{color:var(--pend)}
.row.pending .time::before,.row.st-dada .time::before,.row.st-substituida .time::before,.row.st-cancelada .time::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:7px;vertical-align:1px}
.row.pending .time::before{background:var(--pend)}
.row.st-dada .time::before{background:var(--c-dada)}
.row.st-substituida .time::before{background:var(--c-sub)}
.row.st-cancelada .time::before{background:var(--c-canc)}
.row.st-cancelada .what{color:var(--ink3);text-decoration:line-through;text-decoration-color:var(--ink3)}
.row.extra,.row.cover{--c:var(--c-sub);background:linear-gradient(90deg,color-mix(in srgb,var(--c) 13%,transparent) 0,transparent 55%);border-left:3px solid var(--c);padding-left:12px;margin-left:-15px}
.row.extra .ico,.row.cover .ico{color:var(--c)}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:2px;background:var(--sheet)}
.seg button{padding:7px 13px;font-size:13.5px;font-weight:500;color:var(--ink2);border-right:1px solid var(--rule)}
.seg button:last-child{border-right:0}
.seg button:hover{background:var(--paper);color:var(--ink)}
.seg button[data-st="dada"] .ico{color:var(--c-dada)}
.seg button[data-st="substituida"] .ico{color:var(--c-sub)}
.seg button[data-st="cancelada"] .ico{color:var(--c-canc)}
.seg button.on .ico{color:#fff!important}
.seg button.on[data-st="dada"]{background:var(--c-dada);color:#fff}
.seg button.on[data-st="substituida"]{background:var(--c-sub);color:#fff}
.seg button.on[data-st="cancelada"]{background:var(--c-canc);color:#fff}
.row.st-cancelada .what{text-decoration-color:var(--c-canc)}
.chip[style*="--c"] .ico{color:var(--c)}
.chip.on[style*="--c"]{background:var(--c);border-color:var(--c);color:#fff}
.chip.on[style*="--c"] .ico{color:#fff}
.chip.canc.on{background:var(--c-canc);border-color:var(--c-canc);color:#fff}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:9px}
table.h td:nth-child(2){color:var(--c-dada)}
table.h td:nth-child(3){color:var(--c-sub)}
table.h td:nth-child(6){color:var(--c-canc)}
table.h tfoot td:nth-child(n+2){color:inherit}
.sub-line{grid-column:2 / 4;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13.5px;margin-top:-4px}
.sub-line select{padding:6px 8px;border:1px solid var(--rule);background:var(--sheet);border-radius:2px;min-width:200px}
.sub-line.warn select{border-color:var(--coral)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:5px 11px;border:1px solid var(--rule);border-radius:2px;font-size:13px;color:var(--ink2);background:var(--sheet)}
.chip:hover{border-color:var(--ink)}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.icon-x{color:var(--ink3);font-size:18px;padding:2px 8px}
.icon-x:hover{color:var(--coral)}

.xform{margin:12px 0 0;padding:18px 0 6px;border-top:1px dashed var(--ink3)}
.xform h4{font-family:var(--serif);font-size:18px;margin-bottom:12px}
.xform .f{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;margin-top:14px}
.xform label{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);display:block;margin-bottom:5px}
.xform input[type=time],.xform input[type=text],.xform input[type=date],.xform input[type=number]{padding:8px 9px;border:1px solid var(--rule);background:var(--sheet);border-radius:2px}
.xform input[type=text]{min-width:260px}
.xform .go{background:var(--ink);color:var(--paper);padding:9px 18px;border-radius:2px;font-weight:600}
.xform .go:hover{background:var(--coral)}
.xform .cancel{color:var(--ink2);padding:9px 6px;text-decoration:underline}
.idle{margin-top:10px;padding-top:22px;border-top:1px solid var(--rule)}
.idle h3{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);margin-bottom:12px;font-weight:600}
.idle .list{display:flex;flex-wrap:wrap;gap:8px}
.empty{padding:70px 0;max-width:46ch}
.empty h2{font-family:var(--serif);font-size:34px;font-weight:800;margin-bottom:10px;letter-spacing:-.01em}
.empty p{color:var(--ink2)}

/* ---------- month ---------- */
.pagehead{display:flex;align-items:flex-end;gap:20px;border-bottom:1.5px solid var(--ink);padding-bottom:14px;margin-bottom:6px}
.pagehead h2{font-family:var(--serif);font-weight:800;font-size:44px;letter-spacing:-.02em;line-height:1}
.pagehead .r{margin-left:auto;display:flex;gap:10px;align-items:center}
.pagehead input[type=month]{padding:8px;border:1px solid var(--rule);background:var(--sheet);border-radius:2px}
.pagehead .ghost{border:1px solid var(--ink);padding:8px 14px;border-radius:2px;font-weight:500;font-size:14px}
.pagehead .ghost:hover{background:var(--ink);color:var(--paper)}
table.h{width:100%;border-collapse:collapse;margin-top:8px}
table.h th{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);font-weight:600;text-align:right;padding:12px 10px 10px;border-bottom:1px solid var(--rule)}
table.h th:first-child,table.h td:first-child{text-align:left;padding-left:0}
table.h td{padding:15px 10px;text-align:right;border-bottom:1px solid var(--rule2);font-family:var(--mono);font-size:14px;color:var(--ink2)}
table.h td:first-child{font-family:var(--serif);font-weight:800;font-size:20px;color:var(--ink)}
table.h td.total{font-size:20px;color:var(--ink);font-weight:500}
table.h tr.ln:hover td{background:var(--sheet);cursor:pointer}
table.h td.z{color:var(--rule)}
table.h tfoot td{border-bottom:0;border-top:1.5px solid var(--ink);color:var(--ink);font-size:16px}
table.h tfoot td:first-child{font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-family:var(--sans);font-weight:600}
.detail td{padding:0!important;background:var(--sheet)}
.detail .in{padding:6px 18px 18px;text-align:left}
.detail .in div{display:grid;grid-template-columns:96px 70px 1fr 70px;gap:12px;padding:7px 0;border-bottom:1px solid var(--rule2);font-family:var(--sans);font-size:14px}
.detail .in div span:last-child{text-align:right}
.note{margin-top:22px;font-size:13px;color:var(--ink2);max-width:70ch}

/* ---------- teachers setup ---------- */
.setup{display:grid;grid-template-columns:240px 1fr;gap:44px;margin-top:26px}
.plist button{display:flex;justify-content:space-between;width:100%;text-align:left;padding:11px 0;border-bottom:1px solid var(--rule2);font-weight:500}
.plist button.on{font-family:var(--serif);font-weight:800;font-size:19px}
.plist button small{color:var(--ink3);font-family:var(--mono);font-weight:400}
.plist .off{color:var(--ink3)}
.addp{display:flex;gap:8px;margin-top:18px}
.addp input{flex:1;min-width:0;padding:8px;border:1px solid var(--rule);background:var(--sheet);border-radius:2px}
.addp button{background:var(--ink);color:var(--paper);padding:8px 14px;border-radius:2px;font-weight:600}
.week{display:grid;grid-template-columns:repeat(6,1fr);gap:0;border-top:1.5px solid var(--ink);margin-top:18px}
.week .col{border-right:1px solid var(--rule2);padding:10px 6px 14px 10px;min-height:150px}
.week .col:last-child{border-right:0}
.week h5{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);margin-bottom:10px;font-weight:600}
.slot{padding:8px 14px 8px 0;border-bottom:1px solid var(--rule2);font-size:13.5px;position:relative}
.xform select{padding:8px 9px;border:1px solid var(--rule);background:var(--sheet);border-radius:2px}
.slot .mono{display:block;color:var(--ink2);font-size:12px;white-space:nowrap;letter-spacing:-.01em}
.slot button{position:absolute;right:0;top:6px;color:var(--ink3);font-size:16px}
.slot button:hover{color:var(--coral)}
.slotform{margin-top:26px}
.pname{display:flex;align-items:center;gap:20px}
.pname h3{font-family:var(--serif);font-size:38px;font-weight:800;letter-spacing:-.02em}


.av{flex:none;border-radius:50%;object-fit:cover;background:#E9E9EC;color:var(--ink2);display:inline-flex;align-items:center;justify-content:center;font-weight:700;letter-spacing:-.02em;overflow:hidden;vertical-align:middle}
.ico{width:1.15em;height:1.15em;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.2em}
.seg button,.chip{display:inline-flex;align-items:center;gap:7px}
.with-av{display:flex;align-items:center;gap:12px}
.plist .with-av{gap:10px}
.photo-tools{display:flex;gap:14px;align-items:center;font-size:13px}
.photo-tools button{color:var(--ink2);text-decoration:underline;text-underline-offset:3px}
.photo-tools button:hover{color:var(--coral)}
/* turmas */
.tm{padding:24px 0;border-bottom:1px solid var(--rule2)}
.tm-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.tm-name{font-weight:800;font-size:23px;letter-spacing:-.02em}
.tag{font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;padding:3px 8px;border:1px solid var(--rule);border-radius:2px;color:var(--ink2)}
.tag.vip{background:var(--ink);color:#fff;border-color:var(--ink)}
.tp{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;padding:3px 8px 3px 6px;border-radius:2px;margin-right:9px;vertical-align:middle;line-height:1.2;font-family:var(--sans)}
.tp .ico{font-size:13px}
.tp.vip{background:var(--coral);color:#fff}
.tp.grp{background:#E4ECEE;color:var(--slate)}
.pill{font-size:12.5px;font-weight:600;padding:3px 9px;border-radius:2px}
.pill.ok{color:var(--c-dada);background:#E1F0E7}.pill.late{color:#7A4A00;background:var(--pend-bg)}
.pill.bad{color:var(--c-canc);background:#FBE4E1}.pill.fin{color:#fff;background:var(--ink)}.pill.fut{color:var(--ink2);background:var(--sheet)}
.tm-edit:first-of-type{margin-left:auto}
.tm-edit{color:var(--ink2);text-decoration:underline;text-underline-offset:3px;font-size:13px}
.tm-edit:hover{color:var(--coral)}
.tm-meta{display:flex;align-items:center;gap:8px;color:var(--ink2);font-size:14px;margin-top:8px;flex-wrap:wrap}
.tm-meta .sep{color:var(--rule)}
.bar{position:relative;height:10px;background:var(--rule2);border-radius:2px;margin:18px 0 12px}
.bar .fill{position:absolute;left:0;top:0;bottom:0;background:var(--c-dada);border-radius:2px}
.bar .mark{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--ink)}
.tm-nums{display:flex;gap:6px 24px;flex-wrap:wrap;font-size:13.5px;color:var(--ink2)}
.tm-nums b{color:var(--ink);font-weight:700}
.tform{margin:22px 0 8px;padding:22px 24px 12px;background:var(--sheet);border-top:2px solid var(--ink)}
.tform h3{font-weight:800;font-size:22px;letter-spacing:-.02em;margin-bottom:14px}
.tform .xform,.tform .f{margin-top:14px}
.hrow{align-items:center!important}
.hrow button{color:var(--ink3);font-size:20px;padding:0 8px}
.hrow button:hover{color:var(--coral)}
.addh{margin-top:10px;color:var(--ink2);text-decoration:underline;text-underline-offset:3px;font-size:13.5px}
.calc{display:block;margin-top:5px;font-size:12px;color:var(--ink3);max-width:30ch}
.fsel{padding:8px;border:1px solid var(--rule);background:var(--sheet);border-radius:2px}
/* fechamento do dia */
.wrapbtn{margin-top:18px;width:100%;background:var(--ink);color:#fff;padding:14px;font-weight:700;border-radius:2px;font-size:15px}
.wrapbtn:hover:not(:disabled){background:var(--c-dada)}
.wrapbtn:disabled{background:var(--rule2);color:var(--ink3);cursor:not-allowed}
.wrapbtn{display:inline-flex;align-items:center;justify-content:center;gap:10px}.wrapbtn .ico{width:18px;height:18px}
.wrapbtn.wait{background:var(--paper);color:var(--ink);border:1px solid var(--ink)}.wrapbtn.wait:hover{background:var(--pend-bg)}
.fecha-bar{position:sticky;bottom:0;margin:34px -48px -80px;padding:16px 48px;background:var(--paper);border-top:1px solid var(--ink);display:flex;justify-content:space-between;align-items:center;gap:24px;z-index:5}
.fecha-bar .wrapbtn{margin:0;width:auto;padding:14px 30px;flex:none}
.fb-txt b{display:block;font-size:17px}.fb-txt span{font-size:14px;color:var(--ink2)}
.lockbar{display:flex;align-items:center;gap:16px;margin-bottom:26px;padding:16px 20px;background:#E1F0E7;border-left:4px solid var(--c-dada);color:#1D5233}
.lockbar .lk .ico{width:26px;height:26px}.lockbar b{display:block;font-size:18px}.lockbar span{font-size:14px}.lockbar .reopen{margin:0 0 0 auto;color:#1D5233}
.reopen{margin-top:10px;color:var(--ink2);text-decoration:underline;text-underline-offset:3px;font-size:13px}
.locked .seg button,.locked .t-tools,.locked .icon-x,.locked .sub-line select,.locked .sub-line .chip{pointer-events:none;opacity:.5}
.wp{margin:0 0 44px;padding:26px 30px 24px;border:2px solid var(--ink)}
.wp h3{font-weight:800;font-size:26px;letter-spacing:-.02em}
.wp .sub{color:var(--ink2);margin:4px 0 16px}
.wp .l{display:grid;grid-template-columns:36px 1fr 120px 90px;gap:14px;align-items:center;padding:10px 0;border-bottom:1px solid var(--rule2);font-size:14.5px}
.wp .l.t{border-bottom:0;border-top:1.5px solid var(--ink);font-weight:700;padding-top:14px}
.wp .l span:nth-child(n+3){text-align:right}
.wp .acts{display:flex;gap:16px;align-items:center;margin-top:22px}
.wp .acts .go{background:var(--c-dada);color:#fff;padding:13px 22px;font-weight:700;border-radius:2px}
.wp .acts .go:hover{background:var(--ink)}
.wp .acts .cancel{color:var(--ink2);text-decoration:underline}
/* importação */
.irow{display:grid;grid-template-columns:28px 1fr 190px 150px 64px;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--rule2);font-size:14px}
.irow .nm{font-weight:600}
.irow small{display:block;color:var(--ink3);font-weight:400;font-size:12.5px;margin-top:2px}
.irow small.warn{color:var(--pend);font-weight:500}
.irow.semprof{background:linear-gradient(90deg,var(--pend-bg),transparent 45%)}
.irow input[type=checkbox]{width:18px;height:18px;accent-color:var(--ink)}
.irow select{padding:6px 8px;border:1px solid var(--rule);background:#fff;border-radius:2px;max-width:100%}
.irow .num{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink2)}
.idet summary{cursor:pointer;color:var(--ink2);padding:12px 0 6px;font-size:14px}
.idet ul{columns:2;font-size:13px;color:var(--ink2);padding:6px 0 12px 18px}
.cands{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 18px}
.cands label{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--rule);padding:6px 11px;border-radius:2px;background:#fff;font-size:13.5px;cursor:pointer}
.troca{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px;padding:12px 14px;background:var(--sheet);border-left:3px solid var(--ink);font-size:14px}
.troca select{padding:7px 9px;border:1px solid var(--rule);background:#fff;border-radius:2px;min-width:180px}
.troca .go{background:var(--ink);color:#fff;padding:8px 16px;border-radius:2px;font-weight:600}
.troca .cancel{color:var(--ink2);text-decoration:underline}
.troca small{flex-basis:100%;color:var(--ink3);font-size:12.5px}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:2px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
#toast.err{background:var(--coral)}
/* ---------- quem está usando + presença ---------- */
#quem{min-height:100vh;padding:9vh 24px 60px;text-align:center}
#quem .br{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);font-weight:600}#quem .br b{color:var(--coral)}
#quem h1{font-weight:800;font-size:clamp(40px,6vw,64px);letter-spacing:-.03em;line-height:1;margin:20px 0 10px}
#quem .qs{color:var(--ink2);font-size:15px;margin-bottom:46px}
.qg{display:flex;gap:26px;justify-content:center;flex-wrap:wrap;max-width:760px;margin:0 auto}
.qp{width:116px;position:relative}
.qa{width:92px;height:92px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;font-size:32px;font-weight:700;letter-spacing:-.02em;border:2px solid transparent;position:relative;transition:transform .12s}
.qa:hover{transform:scale(1.05);border-color:var(--ink)}
.qa.add{background:var(--sheet);color:var(--ink2);border:1.5px dashed var(--ink3);font-weight:400;font-size:38px}
.qp.on .qa{border-color:var(--ink)}
.qp.use .qa::after{content:"";position:absolute;right:3px;bottom:5px;width:18px;height:18px;border-radius:50%;background:var(--c-dada);border:3px solid var(--paper)}
.qn{font-size:16px;font-weight:600}
.qp small{display:block;font-size:12px;color:var(--ink3);margin-top:3px}.qp.use small{color:var(--c-dada)}
.qx{position:absolute;top:-4px;right:6px;width:26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;font-size:16px;line-height:1}
.qadd{margin:34px auto 0;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.qadd input{padding:11px 12px;border:1px solid var(--rule);background:var(--sheet);border-radius:2px;min-width:240px;font:inherit}
.qlink{margin-top:36px;font-size:13px;color:var(--ink2);text-decoration:underline;text-underline-offset:3px}
.pres{position:fixed;top:8px;right:20px;z-index:40;display:flex;align-items:center;gap:12px;font-size:13px;color:var(--ink2);padding:4px 0}
.pres .me b{color:var(--ink);font-weight:600}
.pres .st{display:flex}
.pres .m{width:32px;height:32px;border-radius:50%;margin-left:-8px;border:2px solid var(--paper);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;position:relative}
.pres .m:first-child{margin-left:0}
.pres .m::after{content:"";position:absolute;right:-2px;bottom:-2px;width:10px;height:10px;border-radius:50%;background:var(--c-dada);border:2px solid var(--paper)}
.pres .m.mais{background:var(--sheet);color:var(--ink2)}.pres .m.mais::after{display:none}
.pres .tip{position:absolute;top:42px;right:0;width:270px;background:var(--paper);border:1px solid var(--ink);border-radius:2px;padding:6px 0;display:none;box-shadow:0 8px 24px rgba(0,0,0,.12)}
.pres:hover .tip,.pres:focus-within .tip{display:block}
.pres .tip .h{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);padding:7px 14px 5px;font-weight:600}
.pres .tip div.it{display:flex;align-items:center;gap:10px;padding:7px 14px;color:var(--ink);font-size:13.5px}
.pres .tip .m2{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex:none}
.pres .tip .it span.t{margin-left:auto;color:var(--ink3);font-size:12px}
#demo:not([hidden]) ~ #app .pres{top:42px}
@media(max-width:760px){.pres .me{display:none}}

/* ---------- VIP (pacotes) ---------- */
.vp{display:grid;grid-template-columns:52px 1fr;gap:4px 18px;padding:24px 0;border-bottom:1px solid var(--rule2);align-items:start}
.vp .vbody{min-width:0}
.vp .nm{font-family:var(--serif);font-weight:800;font-size:23px;letter-spacing:-.02em;line-height:1.15}
.vp .nm small{font-size:13px;font-weight:500;letter-spacing:0;color:var(--ink2);margin-left:10px}
.vtag{display:inline-block;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;font-weight:700;padding:3px 8px;border-radius:2px;margin-left:10px;vertical-align:4px;background:var(--sheet);color:var(--ink2);font-family:var(--sans)}
.vtag.red{background:#FBE4E1;color:var(--c-canc)}.vtag.amb{background:var(--pend-bg);color:#8A5200}.vtag.grn{background:#E5F2EA;color:#1D5233}
.vtiles{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 8px}
.vt{width:64px;padding:7px 0 6px;border:1px solid var(--rule);border-radius:2px;background:var(--paper);text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px;line-height:1.15}
.vt small{font-size:10px;letter-spacing:.08em;color:inherit;opacity:.65;font-weight:600}.vt b{font-size:12.5px;font-weight:700}.vt .ico{font-size:17px;margin-top:1px}
.vt u{font-size:8.5px;text-decoration:none;letter-spacing:.08em;text-transform:uppercase;font-weight:700}
.vt.dada{background:#E5F2EA;border-color:#9CC8AC;color:#1D5233}
.vt.cancelada{background:#FBE4E1;border-color:#E3A59D;color:#8A1F17}
.vt.perdida{background:repeating-linear-gradient(135deg,#F3E4E2 0 5px,#FBE4E1 5px 10px);border-color:#E3A59D;color:#8A1F17}
.vt.agendada{background:#E6EEF8;border-color:#A7BEDF;color:#1B4A82}
.vt.at{background:var(--pend-bg);border-color:#E3C07A;color:#8A5200}
.vt.amarcar{border-style:dashed;color:var(--ink3)}
button.vt:hover{outline:2px solid var(--ink);outline-offset:1px}
.vsum{font-size:13.5px;color:var(--ink2)}
.vacts{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.vb{display:inline-flex;align-items:center;gap:7px;padding:8px 12px;border:1px solid var(--rule);border-radius:2px;font-size:13px;font-weight:500;background:var(--paper);white-space:nowrap}
.vb:hover{border-color:var(--ink)}.vb.pri{background:var(--coral);border-color:var(--coral);color:#fff}.vb.dk{background:var(--ink);border-color:var(--ink);color:#fff}.vb.red:hover{color:var(--c-canc);border-color:var(--c-canc)}
.vb[disabled]{opacity:.4;pointer-events:none}
.vflt{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0 4px;align-items:center}
.vflt .chip b{font-weight:700;margin-left:2px}
.vflt input{margin-left:auto;padding:8px 10px;border:1px solid var(--rule);background:var(--sheet);border-radius:2px;min-width:180px;font-size:14px}
.vleg{margin-top:26px;border-top:1px solid var(--ink);padding-top:12px}.vleg h4{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2);margin-bottom:10px;font-weight:600}
.vleg div{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink2);padding:4px 0}.vleg i{width:22px;height:18px;border:1px solid var(--rule);border-radius:2px;display:inline-block}
.vleg i.dada{background:#E5F2EA;border-color:#9CC8AC}.vleg i.cancelada{background:#FBE4E1;border-color:#E3A59D}.vleg i.agendada{background:#E6EEF8;border-color:#A7BEDF}.vleg i.amarcar{border-style:dashed}.vleg i.at{background:var(--pend-bg);border-color:#E3C07A}
.vsteps{display:flex;margin:22px 0 28px;font-size:13px}.vsteps div{flex:1;padding:9px 0;border-bottom:2px solid var(--rule);color:var(--ink3)}.vsteps div.on{border-color:var(--ink);color:var(--ink);font-weight:600}.vsteps div.ok{border-color:var(--c-dada);color:var(--c-dada)}
.vf label,.mc label{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);display:block;margin:20px 0 7px;font-weight:600}
.vf input[type=text],.vf input[type=tel],.vf input[type=date],.vf input[type=time],.mc input[type=text],.mc input[type=tel],.mc input[type=date],.mc textarea{padding:10px 11px;border:1px solid var(--rule);background:var(--sheet);border-radius:2px;width:100%;max-width:420px;font:inherit}
.mc textarea{max-width:none;min-height:64px;resize:vertical}
.vf .chips{display:flex;gap:6px;flex-wrap:wrap}
.vbig{display:inline-flex;border:1px solid var(--ink);border-radius:2px;overflow:hidden}.vbig button{padding:12px 34px;font-size:26px;font-weight:800;font-family:var(--serif)}.vbig button.on{background:var(--ink);color:#fff}
.vnav{display:flex;gap:14px;align-items:center;margin-top:34px}
.vnav .cancel{color:var(--ink2);text-decoration:underline;text-underline-offset:3px;font-size:14px}
.vdl{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:16px}

/* =====================================================================
   CAMADA DE DADOS
   Duas implementações com a mesma interface: Firestore (produção) e
   localStorage (usado só na pré-visualização local, nunca no site publicado).
   ===================================================================== */
const COL = {profs:'ponto_professores', turmas:'ponto_turmas', regs:'ponto_registros', extras:'ponto_extras', fech:'ponto_fechamentos', cal:'ponto_calendario', pk:'ponto_pacotes', cp:'ponto_checkpoints', eq:'ponto_equipe', pres:'ponto_presenca'};

function FirestoreStore(db){
  const all = async c => (await db.collection(c).get()).docs.map(d => ({id:d.id, ...d.data()}));
  const month = async (c, ym) => (await db.collection(c).where('data','>=',ym+'-01').where('data','<=',ym+'-31').get()).docs.map(d => ({id:d.id, ...d.data()}));
  return {
    async init(){ return {profs: await all(COL.profs), turmas: await all(COL.turmas), cal: await all(COL.cal), pk: await all(COL.pk), cp: await all(COL.cp), eq: await all(COL.eq)}; },
    meKey: 'eic_ponto_me',
    async ping(id, obj){ await db.collection(COL.pres).doc(id).set(obj); },
    async getPres(){ return await all(COL.pres); },
    watchPres(cb){ return db.collection(COL.pres).onSnapshot(sn => cb(sn.docs.map(d => ({id:d.id, ...d.data()}))), () => {}); },
    async loadMonth(ym){ return {regs: await month(COL.regs, ym), extras: await month(COL.extras, ym), fech: await month(COL.fech, ym)}; },
    async put(kind, obj){ const {id, ...rest} = obj; await db.collection(COL[kind]).doc(id).set(rest); },
    async del(kind, id){ await db.collection(COL[kind]).doc(id).delete(); }
  };
}

function LocalStore(){
  const key = k => 'eic_ponto_demo3_' + k;
  const read = k => JSON.parse(localStorage.getItem(key(k)) || '[]');
  const write = (k, v) => localStorage.setItem(key(k), JSON.stringify(v));
  const LP = [];
  return {
    async init(){ return {profs: read('profs'), turmas: read('turmas'), cal: read('cal'), pk: read('pk'), cp: read('cp'), eq: read('eq')}; },
    meKey: key('me'),
    async ping(id, obj){ const m = JSON.parse(localStorage.getItem(key('pres')) || '{}'); m[id] = {id, ...obj}; localStorage.setItem(key('pres'), JSON.stringify(m)); LP.forEach(f => f()); },
    async getPres(){ return Object.values(JSON.parse(localStorage.getItem(key('pres')) || '{}')); },
    watchPres(cb){ const f = () => cb(Object.values(JSON.parse(localStorage.getItem(key('pres')) || '{}'))); LP.push(f); window.addEventListener('storage', e => { if(e.key === key('pres')) f(); }); f(); },
    async loadMonth(ym){ return {regs: read('regs').filter(r => r.data.startsWith(ym)), extras: read('extras').filter(r => r.data.startsWith(ym)), fech: read('fech').filter(r => r.data.startsWith(ym))}; },
    async put(kind, obj){ const l = read(kind).filter(x => x.id !== obj.id); l.push(obj); write(kind, l); },
    async del(kind, id){ write(kind, read(kind).filter(x => x.id !== id)); }
  };
}

async function ensureMonth(ym){
  if(S.loaded.has(ym)) return;
  const m = await S.store.loadMonth(ym);
  m.regs.forEach(r => S.regs[r.id] = r);
  m.extras.forEach(r => S.extras[r.id] = r);
  (m.fech || []).forEach(f => S.fech[f.data] = f);
  S.loaded.add(ym);
}
const hojeStr = () => ymd(new Date());
const addDays = (d, n) => ymd(new Date(parse(d).getTime() + n*864e5));
const fmtData = d => d ? d.split('-').reverse().join('/') : '';
const diaCurto = d => ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'][d];
const slotsOf = t => (t.horarios || []).map(h => ({id:`${t.id}_${h.dia}_${String(h.inicio).replace(':','')}`, turmaId:t.id, profId:t.profId, dia:h.dia, inicio:h.inicio, fim:h.fim, titulo:t.nome, tipo:t.tipo}));
const allSlots = () => S.turmas.filter(t => !t.encerrada).flatMap(slotsOf);
async function ensureRange(){
  const ini = S.turmas.map(t => t.inicio).sort()[0]; if(!ini) return;
  let [y, m] = ini.slice(0,7).split('-').map(Number); const fim = hojeStr().slice(0,7), jobs = [];
  while(`${y}-${pad(m)}` <= fim){ jobs.push(ensureMonth(`${y}-${pad(m)}`)); if(++m > 12){ m = 1; y++; } }
  await Promise.all(jobs);
}
const BLOQ = ['feriado','recesso','semaula'];
const diaSemAula = d => S.cal.find(e => BLOQ.includes(e.tipo) && e.de <= d && d <= (e.ate || e.de));
const regsOf = ym => Object.values(S.regs).filter(r => r.data.startsWith(ym));
const extrasOf = ym => Object.values(S.extras).filter(r => r.data.startsWith(ym));
const prof = id => S.profs.find(p => p.id === id);
const activeProfs = () => S.profs.filter(p => p.ativo !== false).sort((a,b) => a.nome.localeCompare(b.nome,'pt-BR'));
const fechado = d => S.fech[d] && S.fech[d].status === 'fechado';
const hhmm = iso => { const d = new Date(iso); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const regId = (data, slotId) => `${data}_${slotId}`;

/* =====================================================================
   REGRA DAS HORAS (um lugar só)
   dada         -> conta para o professor da grade
   substituída  -> conta para quem substituiu (não para o titular)
   cancelada    -> não conta para ninguém
   extra        -> conta para o professor do lançamento
   ===================================================================== */
function dayModel(date){
  const dow = parse(date).getDay();
  const rows = {};
  activeProfs().forEach(p => rows[p.id] = {p, slots:[], covers:[], extras:[], min:0, pending:0});
  slotsOn(date).sort((a,b) => a.inicio.localeCompare(b.inicio)).forEach(s => {
    const r = S.regs[regId(date, s.id)];
    if(!r && diaSemAula(date)) return;
    const row = rows[r ? r.profId : s.profId];
    if(!row) return;
    row.slots.push({s, r});
    if(!r) row.pending++;
    else if(r.status === 'substituida' && !r.substitutoId) row.pending++;
    else if(r.status === 'dada') row.min += r.minutos;
  });
  Object.values(rows).forEach(row => row.slots.forEach(({s}, i, l) => { const o = l.find((y, j) => j !== i && toMin(y.s.inicio) < toMin(s.fim) && toMin(y.s.fim) > toMin(s.inicio)); if(o) s.conf = o.s; }));
  Object.values(S.regs).filter(r => r.data === date && r.status === 'substituida' && r.substitutoId && rows[r.substitutoId]).forEach(r => {
    rows[r.substitutoId].covers.push(r); rows[r.substitutoId].min += r.minutos;
  });
  Object.values(S.extras).filter(e => e.data === date && rows[e.profId]).sort((a,b) => a.inicio.localeCompare(b.inicio)).forEach(e => {
    rows[e.profId].extras.push(e); rows[e.profId].min += e.minutos;
  });
  return Object.values(rows);
}

function miniCal(){
  const ym = S.calMonth || S.date.slice(0,7), [y, m] = ym.split('-').map(Number), hoje = hojeStr();
  const first = new Date(y, m - 1, 1), start = new Date(y, m - 1, 1 - first.getDay());
  let cells = '';
  for(let i = 0; i < 42; i++){
    const dt = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i), d = ymd(dt), fora = dt.getMonth() !== m - 1;
    if(i >= 35 && fora) break;
    let mark = '';
    if(fechado(d)) mark = 'ok';
    else if(d <= hoje && S.loaded.has(d.slice(0,7)) && dayModel(d).some(x => x.pending)) mark = 'pd';
    cells += `<button class="cd ${diaSemAula(d) ? 'cl' : ''} ${fora ? 'out' : ''} ${d === S.date ? 'sel' : ''} ${d === hoje ? 'hoje' : ''}" data-a="calday" data-d="${d}" aria-label="${dt.getDate()} de ${MESES[dt.getMonth()]}">${dt.getDate()}${mark ? `<i class="${mark}"></i>` : ''}</button>`;
  }
  return `<div class="cal"><div class="cal-h"><button data-a="cal" data-n="-1" aria-label="Mês anterior">‹</button><span>${MESES[m-1]} ${y}</span><button data-a="cal" data-n="1" aria-label="Próximo mês">›</button></div>

function monthTotals(ym){
  const T = {};
  S.profs.forEach(p => T[p.id] = {p, dadas:0, cobriu:0, extras:0, porTipo:{}, canceladas:0, passou:0, lanc:[]});
  regsOf(ym).forEach(r => {
    if(r.status === 'dada' && T[r.profId]){ T[r.profId].dadas += r.minutos; T[r.profId].lanc.push({data:r.data, h:r.inicio, txt:r.titulo, min:r.minutos}); }
    if(r.status === 'substituida'){
      if(T[r.profId]) T[r.profId].passou += r.minutos;
      if(r.substitutoId && T[r.substitutoId]){ T[r.substitutoId].cobriu += r.minutos; T[r.substitutoId].lanc.push({data:r.data, h:r.inicio, txt:`Cobriu ${prof(r.profId)?.nome||''} · ${r.titulo}`, min:r.minutos}); }
    }
    if(r.status === 'cancelada' && T[r.profId]) T[r.profId].canceladas += r.minutos;
  });
  extrasOf(ym).forEach(e => {
    const t = T[e.profId]; if(!t) return;
    t.extras += e.minutos; t.porTipo[e.tipo] = (t.porTipo[e.tipo]||0) + e.minutos;
    t.lanc.push({data:e.data, h:e.inicio, txt:tipoNome(e.tipo) + (e.nota ? ' · ' + e.nota : ''), min:e.minutos});
  });
  return Object.values(T).filter(t => t.p.ativo !== false || t.lanc.length).sort((a,b) => a.p.nome.localeCompare(b.p.nome,'pt-BR'));
}

/* ---------- conferir mês ---------- */
function cfDias(ym){
  const hoje = hojeStr(), [y, m] = ym.split('-').map(Number), n = new Date(y, m, 0).getDate(), out = [];
  for(let i = 1; i <= n; i++){
    const d = `${ym}-${pad(i)}`; if(d >= hoje) break;
    const w = parse(d).getDay(), sa = diaSemAula(d);
    if(sa){ if(w !== 0 && slotsOn(d).length) out.push({d, w, sa}); continue; }
    const mod = dayModel(d), total = mod.reduce((a, r) => a + r.slots.length, 0);
    if(!total) continue;
    const pend = mod.reduce((a, r) => a + r.pending, 0);
    const livres = mod.reduce((a, r) => a + r.slots.filter(x => !x.r).length, 0);
    out.push({d, w, total, pend, livres, quem:mod.filter(r => r.pending).map(r => r.p.nome.split(' ')[0]), fech:fechado(d), f:S.fech[d]});
  }
  return out;
}
const cfAberto = ym => cfDias(ym).filter(x => !x.sa && !x.fech);

/* ---------- checkpoints ---------- */
const CP_N = t => /kids/i.test(t.curso || t.nome || '') ? 5 : /teens/i.test(t.curso || t.nome || '') ? 6 : 0;
const cpTurmas = () => S.turmas.filter(t => !t.encerrada && t.tipo !== 'vip' && CP_N(t));
function cpPrazos(t, n){
  const total = t.aulasTotal || (t.fim ? ocorr(t, t.inicio, t.fim) : 0); if(!total) return [];
  const ant = +t.anteriores || 0, desde = t.acompanharDesde && t.acompanharDesde > t.inicio ? t.acompanharDesde : t.inicio;
  const alvos = Array.from({length:n}, (_, i) => Math.round(total * (i + 1) / n)), out = []; let c = ant, d = desde, k = 0;
  for(let i = 0; i < 2200 && k < n; i++, d = addDays(d, 1)){
    if(!diaSemAula(d)) c += (t.horarios || []).filter(h => h.dia === parse(d).getDay()).length;
    while(k < n && c >= alvos[k]){ out.push(d); k++; }
  }
  out.antes = alvos.map(a => a <= ant);
  return out;
}
function cpModelo(t){
  const n = CP_N(t), doc = S.cp[t.id] || {cps:{}, log:[]}, pr = cpPrazos(t, n), hoje = hojeStr(), lim = addDays(hoje, 14);
  const maxAp = Math.max(0, ...Object.keys(doc.cps).filter(k => doc.cps[k].status === 'aplicado').map(Number)), lista = [];
  for(let k = 1; k <= n; k++){
    const r = doc.cps[k] || null, prazo = pr[k-1] || null; let st;
    if(r) st = r.status === 'aplicado' ? 'ok' : 'pulado';
    else if(k < maxAp) st = 'pulo';
    else if(pr.antes && pr.antes[k-1]) st = 'sem';
    else if(prazo && hoje > addDays(prazo, 7)) st = 'atraso';
    else if(prazo && prazo <= lim) st = 'prox';
    else st = 'fut';
    lista.push({k, r, prazo, st});
  }
  const ruim = lista.filter(x => ['pulo','pulado','atraso','sem'].includes(x.st)), prox = lista.filter(x => x.st === 'prox');
  const nivel = ruim.length ? 'a' : prox.length ? 'p' : 'o';
  const dias = x => Math.max(0, Math.round((parse(x.prazo) - parse(hoje)) / 864e5));
  const pul = ruim.filter(x => x.st === 'pulo' || x.st === 'pulado'), atr = ruim.filter(x => x.st === 'atraso'), sem = ruim.filter(x => x.st === 'sem');
  const tag = pul.length ? (pul.length > 1 ? pul.length + ' pulados?' : `CP ${pul[0].k} pulado?`) : atr.length ? `CP ${atr[0].k} atrasado` : sem.length ? (sem.length > 1 ? sem.length + ' sem registro' : `CP ${sem[0].k} sem registro`) : prox.length ? `CP ${prox[0].k} em ${dias(prox[0])} ${dias(prox[0]) === 1 ? 'dia' : 'dias'}` : lista.every(x => x.st === 'ok') ? 'Módulo completo' : 'Em dia';
  return {t, n, doc, lista, nivel, tag, ruim, prox, terminou:turmaTerminou(t)};
}
const cpNo = x => ({ok:'ok', pulado:'pu', pulo:'pu', sem:'pu', atraso:'at', prox:'pr', fut:''}[x.st]);
const cpGlifo = x => ({ok:'✓', pulado:'×', pulo:'?', sem:'?', atraso:'!'}[x.st] || x.k);
const cpSub = x => x.st === 'ok' ? 'aplicado ' + fmtData(x.r.data).slice(0,5) : x.st === 'pulado' ? 'não foi aplicado' : (x.st === 'pulo' || x.st === 'sem') ? 'sem registro' : x.st === 'atraso' ? 'devia ser até ' + fmtData(x.prazo).slice(0,5) : x.prazo ? 'previsto ' + fmtData(x.prazo).slice(0,5) : 'sem previsão';
function cpBadge(){ const b = $('#cpbadge'); if(!b) return; const n = S.profs.length ? cpTurmas().filter(t => cpModelo(t).nivel === 'a').length : 0; b.textContent = n || ''; }
function renderCp(){
  $('#side').innerHTML = `<div class="bigday" style="font-size:96px">CP</div><div class="wk">checkpoints</div><div class="mo">a cada 2 unidades</div>
    <p class="note" style="margin-top:28px">Kids têm 5 checkpoints por módulo e Teens têm 6. A data prevista sai do andamento das aulas. A turma entra em alerta quando um checkpoint passa de 7 dias do previsto ou quando um posterior foi aplicado sem ele.</p>`;
  const t = S.cpT && S.turmas.find(x => x.id === S.cpT);

  const fil = S.cpF || 'at', profs = activeProfs().filter(p => todas.some(m => m.t.profId === p.id));

  const semHist = qa.filter(m => m.lista.some(x => x.st === 'sem')).length;
  const pulos = qa.flatMap(m => m.lista.filter(x => x.st === 'pulo').map(x => ({m, x}))).slice(0, 4);
  const linha = m => {
    const pf = prof(m.t.profId), st = turmaStats(m.t);
    return `<div class="cpt"><div class="cpth">${pf ? avatar(pf, 30) : ''}<button class="nm" data-a="cp-t" data-id="${m.t.id}">${esc(m.t.nome)}<small>${pf ? esc(pf.nome) : 'Sem professor'}${st.total ? ` · ${st.dadas} de ${st.total} aulas dadas` : ''}</small></button><span class="cptag ${m.terminou && m.nivel !== 'a' ? 'p' : m.nivel}">${esc(m.terminou && m.nivel !== 'a' ? 'Módulo terminou' : m.tag)}</span></div>
      <div class="cptr" style="--n:${m.n}">${m.lista.map(x => `<button class="cpn ${cpNo(x)}" data-a="cp-t" data-id="${m.t.id}" data-k="${x.k}"><div class="cpic">${cpGlifo(x)}</div><small>CP ${x.k}</small><span>${cpSub(x)}</span></button>`).join('')}</div></div>`;
  };
  $('#main').innerHTML = `
    <div class="pagehead"><h2>Checkpoints</h2><div class="r"><span class="note">Aplicados, previstos e pulados em cada turma</span></div></div>
    <div class="cpsum"><div class="a"><b>${qa.length}</b><span>Atrasados ou pulados</span></div><div class="p"><b>${qp.length}</b><span>Chegando nas próximas 2 semanas</span></div><div class="o"><b>${qo.length}</b><span>Em dia</span></div></div>
    ${fim.length ? `<div class="cpal" style="background:#E6EEF8;border-left-color:var(--c-sub)"><b>${fim.length === 1 ? '1 turma terminou' : fim.length + ' turmas terminaram'} o módulo:</b> ${fim.slice(0, 4).map(m => `<button class="nm" style="display:inline;font-weight:600;text-decoration:underline" data-a="cp-t" data-id="${m.t.id}">${esc(m.t.nome)}</button>`).join(', ')}. Confira os checkpoints, encerre o módulo e edite a turma para o próximo.</div>` : ''}

async function cpSalva(t, k, reg, txt){

  doc.id = t.id; doc.turmaId = t.id; doc.cps = doc.cps || {}; doc.log = doc.log || [];

/* ---------- turmas ---------- */
function ocorr(t, de, ate){
  let n = 0; if(!de || !ate || de > ate) return 0;
  for(let d = de; d <= ate; d = addDays(d,1)){ if(diaSemAula(d)) continue; const w = parse(d).getDay(); n += (t.horarios || []).filter(h => h.dia === w).length; }
  return n;
}

function turmaStats(t){
  const hoje = hojeStr(), ontem = addDays(hoje,-1);
  const regs = Object.values(S.regs).filter(r => r.turmaId === t.id);
  const ant = +t.anteriores || 0, desde = t.acompanharDesde && t.acompanharDesde > t.inicio ? t.acompanharDesde : t.inicio;
  const dadas = ant + regs.filter(r => r.status === 'dada' || r.status === 'substituida').length;
  const canc = regs.filter(r => r.status === 'cancelada').length;
  const calc = t.fim ? ocorr(t, t.inicio, t.fim) : 0;
  const total = t.aulasTotal || calc;
  const ateEsp = t.fim && t.fim < ontem ? t.fim : ontem;
  const nRem = regs.filter(r => r.status === 'removida' && r.data <= ateEsp).length;
  const esperadas = total ? Math.min(total, ant + ocorr(t, desde, ateEsp) - nRem) : 0;
  const semConf = Math.max(0, ocorr(t, desde, ontem) - regs.filter(r => r.data < hoje).length);
  const falta = Math.max(0, total - dadas);
  let proj = null;
  if(total && falta > 0 && (t.horarios || []).length){
    let n = falta, d = hoje < t.inicio ? t.inicio : hoje;
    for(let i = 0; i < 900; i++){
      const w = parse(d).getDay(), doDia = t.horarios.filter(h => h.dia === w).length;
      const k = d === hoje ? Math.max(0, doDia - regs.filter(r => r.data === hoje).length) : doDia;
      if(!diaSemAula(d)) n -= k; if(n <= 0){ proj = d; break; } d = addDays(d,1);
    }
  }
  const atrasoDias = proj && t.fim ? Math.round((parse(proj) - parse(t.fim)) / 864e5) : null;
  return {total, calc, dadas, canc, esperadas, semConf, falta, proj, atrasoDias, lag: esperadas - dadas,
          pct: total ? Math.min(100, dadas/total*100) : 0, pctEsp: total ? Math.min(100, esperadas/total*100) : 0,
          concluida: total > 0 && dadas >= total, futura: hoje < t.inicio};
}

function turmaPill(t, st){
  if(t.encerrada) return '<span class="pill fut">Encerrada</span>';
  if(st.concluida) return '<span class="pill fin">Concluída</span>';
  if(st.futura) return `<span class="pill fut">Começa em ${fmtData(t.inicio)}</span>`;
  if(!st.total) return '<span class="pill fut">Sem previsão</span>';
  if(st.lag > 0) return `<span class="pill ${st.lag >= 4 ? 'bad' : 'late'}">${st.lag} ${st.lag === 1 ? 'aula atrás' : 'aulas atrás'}</span>`;
  return '<span class="pill ok">No ritmo</span>';
}

/* ---------- importação do Kaits ---------- */
const norm = x => String(x || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();
const palavras = x => norm(x).split(/[^a-z0-9]+/).filter(Boolean);
const IGNORA = new Set(['vip','kids','kid','teens','teen','adults','adult','intensivo','preparatorio','curso','ingles','turma','life','world','sabado']);
const textoDe = h => new DOMParser().parseFromString(h.replace(/<br\s*\/?>/gi, '\n'), 'text/html').body.textContent.trim();

function parseKaits(texto){
  const DIAS_PT = {'domingo':0,'segunda-feira':1,'terça-feira':2,'quarta-feira':3,'quinta-feira':4,'sexta-feira':5,'sábado':6};
  const dd = x => { const m = /^(\d\d)\/(\d\d)\/(\d{4})/.exec((x || '').trim()); return m ? `${m[3]}-${m[2]}-${m[1]}` : null; };
  const corpo = texto.slice(Math.max(0, texto.indexOf('ordenar')));
  const linhas = corpo.split('</tr>').map(r => [...r.matchAll(/<td[^>]*>([\s\S]*?)<\/td>/g)].map(m => textoDe(m[1])));
  const cab = linhas.find(c => c.includes('nome') && c.includes('curso'));
  if(!cab) return [];
  const doFim = cab.length;
  const pos = f => { const i = cab.findIndex(f); return i < 0 ? -1 : doFim - i; };
  const ix = {nome:pos(c => c === 'nome'), curso:pos(c => c === 'curso'), ini:pos(c => c.startsWith('início')), fim:pos(c => c.startsWith('término')), status:pos(c => c === 'status'),
              hor:pos(c => c.startsWith('horário')), carga:pos(c => c.startsWith('carga')), prof:pos(c => /^(professor|docente)/.test(c))};
  const out = [];
  linhas.forEach(c => {
    if(c.length < Math.max(doFim - 2, 6) || c === cab) return;
    const g = i => i > 0 ? (c[c.length - i] || '') : '';
    if(g(ix.nome) === 'nome') return;
    const horarios = [];
    g(ix.hor).split('\n').forEach(l => {
      const m = /^(.+?) às (\d\d:\d\d) por (\d+) min/.exec(l.trim());
      if(m && DIAS_PT[m[1].trim().toLowerCase()] !== undefined){ const [h, mi] = m[2].split(':').map(Number), e = h*60 + mi + +m[3]; horarios.push({dia:DIAS_PT[m[1].trim().toLowerCase()], inicio:m[2], fim:`${pad(Math.floor(e/60))}:${pad(e%60)}`}); }
    });
    const cg = /^(\d+):(\d+)/.exec(g(ix.carga));
    out.push({nome:g(ix.nome).replace(/\s+/g, ' ').trim(), curso:g(ix.curso).trim(), inicio:dd(g(ix.ini)), fim:dd(g(ix.fim)), status:g(ix.status), horarios, cargaH:cg ? +cg[1] + +cg[2]/60 : null,
              profsKaits:g(ix.prof).split(/[;\n]+/).flatMap(x => x.split(/\s*,\s*/)).map(x => x.trim()).filter(Boolean), temColunaProf:ix.prof > 0});
  });
  return out;
}

/* algum dos apelidos do professor aparece no título da turma? (Gui casa com Guilherme) */
function nomeNoTitulo(titulo, apelidos){
  const t = palavras(titulo);
  return (apelidos || []).some(a => { const n = norm(a); return n && t.some(w => w === n || (n.length >= 3 && w.length >= 3 && (w.startsWith(n) || n.startsWith(w)))); });
}

/* equipe ativa da escola: apelido no sistema, nome completo no Kaits */
const EQUIPE = [
  {nome:'Leo', kaits:'Leonardo Branco Costa', alias:['leo','leonardo']},
  {nome:'Lucas', kaits:'Lucas Davanso', alias:['lucas']},
  {nome:'Gui', kaits:'Guilherme Varela Monteiro', alias:['gui','guilherme']},
  {nome:'Nara', kaits:'Nara Maria Rossinoli Maciel', alias:['nara']},
  {nome:'Duda', kaits:'Maria Eduarda Camano', alias:['duda']},
  {nome:'Lívia', kaits:'Lívia Vieira Brito', alias:['livia']}
];

function kaitsParaTurma(k, id){
  const hoje = hojeStr(), vip = /vip/i.test(k.nome + ' ' + k.curso);
  const dur = toMin(k.horarios[0].fim) - toMin(k.horarios[0].inicio) || 60;
  const total = k.cargaH ? Math.round(k.cargaH*60/dur) : null;
  let ant = 0;
  if(total && k.fim > k.inicio){
    const dias = (parse(k.fim) - parse(k.inicio)) / 864e5, dec = Math.max(0, (parse(hoje) - parse(k.inicio)) / 864e5);
    ant = Math.max(0, Math.min(total, Math.round(total * dec / dias)));
  }
  return {id, nome:k.nome, tipo:vip ? 'vip' : 'turma', curso:k.curso, profId:'', inicio:k.inicio, fim:vip && !total ? null : k.fim, aulasTotal:total,
          horarios:k.horarios, encerrada:false, anteriores:ant, acompanharDesde:hoje};
}

function montarImportacao(itens, arquivo){
  const hoje = hojeStr(), ativos = [], encerradas = [], semDef = [];
  itens.forEach(k => {
    if(!k.inicio || !k.fim || !k.horarios.length || /ainda n[aã]o definida/i.test(k.nome)) semDef.push(k);
    else if(k.fim < hoje) encerradas.push(k); else ativos.push(k);
  });
  const cands = new Map();
  const profDe = kn => {
    const r = EQUIPE.find(e => norm(e.kaits) === norm(kn)), alias = r ? r.alias : [palavras(kn)[0]];
    const ex = S.profs.find(p => p.ativo !== false && (norm(p.kaits) === norm(kn) || (r && norm(p.nome) === norm(r.nome))));
    if(ex) return {ref:ex.id, kaitsNome:kn, nome:ex.nome, alias};
    const chave = 'c:' + norm(kn);
    if(!cands.has(chave)) cands.set(chave, {chave, kaitsNome:kn, nome:r ? r.nome : kn, n:0, criar:!!r, equipe:!!r});
    return {ref:chave, kaitsNome:kn, nome:r ? r.nome : kn, alias};
  };
  const usados = new Set(), existentes = new Set(S.turmas.map(t => t.id));
  const linhas = ativos.map(k => {
    let refs = k.profsKaits.map(profDe);
    if(!refs.length) refs = EQUIPE.filter(e => nomeNoTitulo(k.nome, e.alias)).map(e => profDe(e.kaits));
    refs.forEach(x => { if(x.ref.startsWith('c:')) cands.get(x.ref).n++; });
    let id = 'k_' + norm(k.nome).replace(/[^a-z0-9]+/g, '-') + '_' + k.inicio; while(usados.has(id)) id += 'x'; usados.add(id);
    return {k, t:kaitsParaTurma(k, id), refs, dup:existentes.has(id), manual:false, profId:'', aviso:'', sel:false};
  });
  const candidatos = [...cands.values()].sort((a, b) => (b.equipe - a.equipe) || (b.n - a.n));
  const im = {arquivo, total:itens.length, linhas, candidatos, encerradas, semDef};
  resolver(im);
  return im;
}

/* decide o professor de cada turma: só equipe ativa; com mais de um, pelo nome no título */
function resolver(im){
  const ativoRef = ref => !ref.startsWith('c:') || !!im.candidatos.find(c => c.chave === ref && c.criar);
  im.linhas.forEach(x => {
    if(x.manual) return;
    const ok = x.refs.filter(r => ativoRef(r.ref)); x.profId = ''; x.aviso = '';
    if(ok.length === 1) x.profId = ok[0].ref;
    else if(ok.length > 1){
      const a = ok.filter(r => nomeNoTitulo(x.k.nome, r.alias));
      if(a.length === 1){ x.profId = a[0].ref; x.aviso = `Kaits traz ${ok.map(r => r.nome).join(' e ')}. Escolhi ${a[0].nome} pelo título.`; }
      else x.aviso = `Kaits traz ${ok.map(r => r.nome).join(' e ')} e o título não decide. Escolha.`;
    } else if(x.refs.length) x.aviso = `Kaits traz ${x.refs.map(r => r.kaitsNome).join('; ')}, ninguém da equipe ativa. Escolha.`;
    x.sel = !!x.profId && !x.dup;
  });
}

function opcoesProf(im, atual){
  return `<option value="">Escolher professor</option>` + S.profs.filter(p => p.ativo !== false).map(p => `<option value="${p.id}" ${p.id === atual ? 'selected' : ''}>${esc(p.nome)}</option>`).join('')
    + im.candidatos.filter(c => c.criar).map(c => `<option value="${c.chave}" ${c.chave === atual ? 'selected' : ''}>${esc(c.nome)} (novo)</option>`).join('');
}

    <p class="note" style="max-width:none">As aulas já dadas antes do sistema são uma estimativa pelo calendário e podem ser corrigidas em Editar. Aulas do Kaits sem previsão (VIP sem carga horária) entram sem barra de progresso.</p>
    <div class="xform"><div class="f" style="padding-bottom:12px"><button class="go" data-a="iok" ${n ? '' : 'disabled'}>Importar ${n} ${n === 1 ? 'turma' : 'turmas'}</button><button class="cancel" data-a="icancel">Cancelar</button></div></div></div>`;

/* ---------- professores ---------- */
/* =====================================================================
   HORÁRIOS LIVRES (quem está livre, quando)
   Considera: grade das turmas ativas, aulas canceladas/excluídas (liberam o horário),
   substituições (quem cobriu fica ocupado, o titular fica livre) e atividades extras.
   ===================================================================== */
const JANELA = {1:['08:00','21:00'], 2:['08:00','21:00'], 3:['08:00','21:00'], 4:['08:00','21:00'], 5:['08:00','21:00'], 6:['08:00','13:00']};
const fmtMin = m => `${pad(Math.floor(m/60))}:${pad(m%60)}`;
function ocupado(pid, date){
  const dow = parse(date).getDay(), out = [];
  slotsOn(date).filter(s => s.profId === pid).forEach(s => {
    const r = S.regs[regId(date, s.id)];
    if(r && (r.status === 'cancelada' || r.status === 'removida')) return;
    if(r && r.status === 'substituida' && r.substitutoId && r.substitutoId !== pid) return;
    out.push({ini:s.inicio, fim:s.fim, txt:s.titulo});
  });
  Object.values(S.regs).filter(r => r.data === date && r.status === 'substituida' && r.substitutoId === pid).forEach(r => out.push({ini:r.inicio, fim:r.fim, txt:'Cobrindo ' + r.titulo}));
  Object.values(S.extras).filter(e => e.data === date && e.profId === pid).forEach(e => out.push({ini:e.inicio, fim:e.fim, txt:tipoNome(e.tipo) + (e.nota ? ': ' + e.nota : ''), extra:true}));
  return out.sort((a,b) => toMin(a.ini) - toMin(b.ini));
}
function livres(busy, jan, dur){
  if(!jan) return [];
  const [a, b] = jan.map(toMin), out = []; let cur = a;
  busy.forEach(x => { if(toMin(x.ini) - cur >= dur) out.push([cur, toMin(x.ini)]); cur = Math.max(cur, toMin(x.fim)); });
  if(b - cur >= dur) out.push([cur, b]);
  return out;
}
const segunda = d => { const w = parse(d).getDay(); return addDays(d, w === 0 ? 1 : 1 - w); };
async function agCarrega(){
  if(!S.ag){ const leo = activeProfs().find(p => /^le[oó]$/i.test(p.nome)) || activeProfs()[0]; S.ag = {profId:leo?.id || null, ini:segunda(hojeStr()), dur:60, qd:hojeStr(), qh:'16:00'}; }
  await ensureMonth(S.ag.ini.slice(0,7)); await ensureMonth(addDays(S.ag.ini, 5).slice(0,7)); await ensureMonth(S.ag.qd.slice(0,7));
}
function agSemana(){
  const g = S.ag, hoje = hojeStr();
  return [0,1,2,3,4,5].map(i => { const d = addDays(g.ini, i), dow = parse(d).getDay(), busy = ocupado(g.profId, d);
    const sa = diaSemAula(d), jan = sa ? null : JANELA[dow];
    return {d, dow, busy, jan, sa, livres:livres(busy, jan, g.dur), passado:d < hoje}; });
}
function agTexto(){
  const g = S.ag, p = prof(g.profId), dias = agSemana().filter(x => !x.passado);
  const lin = dias.map(x => `${diaCurto(x.dow)} ${x.d.slice(8)}/${x.d.slice(5,7)}: ${x.sa ? 'sem aula (' + x.sa.nome + ')' : x.livres.length ? x.livres.map(l => fmtMin(l[0]) + ' às ' + fmtMin(l[1])).join(', ') : 'sem horário livre'}`);
  return `Horários livres de ${p.nome} (aula de ${g.dur} min):\n` + lin.join('\n');
}
const normTxt = t => String(t).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const DIAS_BUSCA = ['dom','seg','ter','qua','qui','sex','sab'];
function lerBusca(q){
  const t = normTxt(q).trim(); if(!t) return null;
  const hoje = hojeStr(); let d = null, hora = null, dur = null, achou = false;
  const RM = /(\d{1,3})\s*min/, RH = /\b(\d{1,2})\s*(?:h|:)\s*(\d{2})?|\bas\s+(\d{1,2})\b/;
  let m = t.match(RM); if(m) dur = +m[1];
  const t2 = t.replace(RM, ' ');
  m = t2.match(RH);
  if(m){ const h = +(m[1] ?? m[3]), mi = +(m[2] || 0); if(h < 24 && mi < 60){ hora = `${pad(h)}:${pad(mi)}`; achou = true; } }
  const t3 = t2.replace(RH, ' ');
  m = t3.match(/\b(\d{1,2})[\/\-](\d{1,2})(?:[\/\-](\d{2,4}))?/);
  if(m){ const y = m[3] ? (+m[3] < 100 ? 2000 + +m[3] : +m[3]) : +hoje.slice(0,4); d = `${y}-${pad(+m[2])}-${pad(+m[1])}`; if(!m[3] && d < hoje) d = `${y + 1}-${pad(+m[2])}-${pad(+m[1])}`; achou = true; }
  else if(/\bamanha\b/.test(t3)){ d = addDays(hoje, 1); achou = true; }
  else if(/\bhoje\b/.test(t3)){ d = hoje; achou = true; }
  else { const k = DIAS_BUSCA.findIndex(x => new RegExp('\\b' + x).test(t3)); if(k >= 0){ for(let i = 0; i < 7; i++){ const c = addDays(hoje, i); if(parse(c).getDay() === k){ d = c; break; } } achou = true; } }
  return achou ? {d: d || hoje, hora, dur} : null;
}
async function agBuscaHtml(){
  const g = S.ag, p = prof(g.profId), r = lerBusca(g.q || '');
  if(!g.q || !p) return '';
  if(!r) return `<div class="bq">Não entendi. Tente assim: <em>terça 16h</em>, <em>sex 14:30</em>, <em>24/11 18h</em> ou <em>amanhã 10h 90min</em>.</div>`;
  await ensureMonth(r.d.slice(0,7));
  const dur = r.dur || g.dur, dow = parse(r.d).getDay(), quando = `${diaCurto(dow)} ${r.d.slice(8)}/${r.d.slice(5,7)}`, sa = diaSemAula(r.d);
  if(sa) return `<div class="bq no"><b>${quando}:</b> sem aula (${esc(sa.nome)}).</div>`;
  const busy = ocupado(g.profId, r.d), jan = JANELA[dow], lv = livres(busy, jan, dur);
  const semAt = jan ? '' : ' Esse dia não tem atendimento na escola.';
  if(!r.hora){
    return `<div class="bq"><b>${esc(p.nome)}</b> em ${quando}, para uma aula de ${dur} min:<div class="ag-free" style="margin-top:8px">${lv.length ? lv.map(l => `<span>${fmtMin(l[0])}–${fmtMin(l[1])}</span>`).join('') : '<em>Sem horário livre</em>'}</div>${semAt}</div>`;
  }
  const a = toMin(r.hora), b = a + dur, bate = busy.find(o => toMin(o.ini) < b && toMin(o.fim) > a), fora = jan && (a < toMin(jan[0]) || b > toMin(jan[1]));
  const quem = activeProfs().map(x => ({x, bate: ocupado(x.id, r.d).find(o => toMin(o.ini) < b && toMin(o.fim) > a)}));
  const livresQ = quem.filter(q => !q.bate).map(q => `<span class="yes">${esc(q.x.nome)}</span>`).join('') || '<em>ninguém</em>';
  const prox = lv.slice(0, 4).map(l => `<span>${fmtMin(l[0])}–${fmtMin(l[1])}</span>`).join('');
  return `<div class="bq ${bate ? 'no' : 'ok'}"><div class="bqh"><span><b>${esc(p.nome)}</b> ${bate ? 'está ocupado' : 'está livre'}</span><span class="bqw">${quando} · ${r.hora} às ${fmtMin(b)}</span></div>
    ${bate ? `<div class="bqs">Ocupado com: ${esc(bate.txt)} (${bate.ini}–${bate.fim}).</div>` : ''}
    ${fora ? '<div class="bqs">Atenção: fora do horário de atendimento da escola.</div>' : ''}
    ${bate && prox ? `<div class="bqs">Horários livres de ${esc(p.nome)} nesse dia:</div><div class="ag-free" style="margin-top:6px">${prox}</div>` : ''}
    <div class="bqs" style="margin-top:12px">Quem está livre nesse horário:</div><div class="ag-res" style="margin:6px 0 0">${livresQ}</div></div>`;
}

/* =====================================================================
   PACOTES VIP (4 ou 8 aulas)
   Cada pacote guarda as datas das aulas. As aulas aparecem no painel do
   Dia como qualquer outra (a situação dada/cancelada é lançada lá, em
   ponto_registros) e ocupam o horário do professor. O pacote só guarda
   o que a grade não sabe: reposição, motivo do cancelamento, prazo.
   ===================================================================== */
const VMOT = [{id:'Saúde', ic:'cruz'}, {id:'Viagem', ic:'aviao'}, {id:'Trabalho', ic:'maleta'}, {id:'Compromisso', ic:'calendario'}, {id:'Outro', ic:'outro'}];
const VQUEM = [{id:'aluno', n:'Aluno'}, {id:'prof', n:'Professor'}, {id:'escola', n:'Escola'}];
const pkSlotId = (k, n, rep) => `pk_${k.id}_${n}${rep ? 'r' : ''}`;
const pkOf = id => S.pk.find(k => k.id === id);
const pnome = k => String(k.aluno || '').trim().split(/\s+/)[0];
const dmy = d => fmtData(d).slice(0,5);
const diaLong = d => DIAS[parse(d).getDay()];
const pkSave = k => S.store.put('pk', JSON.parse(JSON.stringify(k)));
const pkPerdida = a => !!(a.cancel && a.cancel.direito === 'nao');

function pkSlots(date){
  const dow = parse(date).getDay(), out = [];
  S.pk.forEach(k => k.aulas.forEach(a => [[a, false], [a.rep, true]].forEach(([x, rep]) => {
    if(x && x.data === date) out.push({id:pkSlotId(k, a.n, rep), turmaId:'pk_' + k.id, profId:k.profId, dia:dow, inicio:x.inicio, fim:x.fim, titulo:'VIP · ' + k.aluno, tipo:'vip', pk:{k:k.id, n:a.n, total:k.total, rep}});
  })));
  return out;
}
/* última data em que a turma ainda tem aula: previsão pelo andamento (aulas dadas x total) ou a data de término */
const _ult = new Map();
function turmaUltima(t){
  if(_ult.has(t.id)) return _ult.get(t.id);
  let u = null; const st = turmaStats(t);
  if(st.total){
    if(st.concluida){ const ds = Object.values(S.regs).filter(r => r.turmaId === t.id && (r.status === 'dada' || r.status === 'substituida')).map(r => r.data).sort(); u = ds.length ? ds[ds.length-1] : hojeStr(); }
    else if(st.proj) u = st.proj;
  } else if(t.fim) u = t.fim;
  _ult.set(t.id, u); return u;
}
const turmaTerminou = t => { if(t.encerrada) return false; const st = turmaStats(t); return st.total ? st.concluida : !!(t.fim && t.fim < hojeStr()); };
const slotsOn = date => { const dow = parse(date).getDay(); return S.turmas.filter(t => !t.encerrada && t.inicio <= date).flatMap(t => { const u = turmaUltima(t); return slotsOf(t).filter(s => s.dia === dow && (!u || date <= u || S.regs[regId(date, s.id)])); }).concat(pkSlots(date)); };

function pkEstado(k, a){
  if(!a.data) return {st:'amarcar', rep:false};
  const reg = (x, rep) => S.regs[regId(x.data, pkSlotId(k, a.n, rep))];
  const ok = r => r && (r.status === 'dada' || r.status === 'substituida');
  const r0 = reg(a, false), hoje = hojeStr();
  if(ok(r0)) return {st:'dada', r:r0, rep:false};
  if(r0 && r0.status === 'cancelada'){
    if(a.rep && a.rep.data){
      const r1 = reg(a.rep, true);
      if(ok(r1)) return {st:'dada', r:r1, rep:true, o:true};
      if(r1 && r1.status === 'cancelada') return pkPerdida(a) ? {st:'perdida', r:r1, rep:true, o:true} : {st:'cancelada', r:r1, rep:true, o:true, pend:true};
      return {st:'agendada', r:r1 || null, rep:true, o:true, atras:a.rep.data < hoje && !r1};
    }
    return pkPerdida(a) ? {st:'perdida', r:r0, rep:false, o:true} : {st:'cancelada', r:r0, rep:false, o:true, pend:true};
  }
  return {st:'agendada', r:r0 || null, rep:false, atras:a.data < hoje && !r0};
}
function pkResumo(k){
  const r = {dada:0, pend:0, perdida:0, agend:0, atras:0, amarcar:0, rest:0, prox:null};
  k.aulas.forEach(a => {
    const e = pkEstado(k, a);
    if(e.st === 'dada') r.dada++;
    else if(e.st === 'perdida') r.perdida++;
    else if(e.st === 'amarcar'){ r.amarcar++; r.rest++; }
    else if(e.st === 'cancelada'){ r.pend++; r.rest++; }
    else { r.agend++; r.rest++; if(e.atras) r.atras++; const d = e.rep ? a.rep.data : a.data; if(!r.prox || d < r.prox) r.prox = d; }
  });
  r.term = r.rest > 0 && r.rest <= k.total / 4;
  return r;
}
function pkPrazo(k){
  if(k.prazo) return k.prazo;
  const todas = k.aulas.filter(a => a.data), vivas = todas.filter(a => { const e = pkEstado(k, a); return !(e.st === 'cancelada' && !e.rep); });
  const ds = (vivas.length ? vivas : todas).map(a => { const e = pkEstado(k, a); return e.rep ? a.rep.data : a.data; }).sort();
  return ds[ds.length - 1] || null;
}
function pkDiaHora(k){
  const set = new Set(); k.aulas.forEach(a => { if(a.data) set.add(parse(a.data).getDay() + '|' + a.inicio); });
  const it = [...set].map(x => x.split('|')), hs = [...new Set(it.map(i => i[1]))];
  const dias = [...new Set(it.map(i => +i[0]))].sort().map(d => DIAS[d].replace('-feira', '').toLowerCase());
  const txt = dias.length > 1 ? dias.slice(0, -1).join(', ') + ' e ' + dias[dias.length - 1] : (dias[0] || '');
  return txt + (hs.length === 1 ? ' às ' + hs[0] : '');
}
async function vipLoad(){
  const ms = new Set();
  S.pk.forEach(k => k.aulas.forEach(a => [a.data, a.rep && a.rep.data].forEach(d => d && ms.add(d.slice(0, 7)))));
  await Promise.all([...ms].map(ensureMonth));
}
async function loadRange(d1, d2){
  const ms = new Set(); for(let d = d1; d <= d2; d = addDays(d, 20)) ms.add(d.slice(0, 7)); ms.add(d2.slice(0, 7));
  await Promise.all([...ms].map(ensureMonth));
}
function pkLimpaRep(s, data){
  if(!s.pk || s.pk.rep) return;
  const k = pkOf(s.pk.k), a = k && k.aulas.find(x => x.n === s.pk.n), r = S.regs[regId(data, s.id)];
  if(a && a.rep && !(r && r.status === 'cancelada')){ a.rep = null; persist(() => pkSave(k)); }
}
async function pkSetReg(k, a, rep, st){
  const x = rep ? a.rep : a; if(!x || !x.data) return;
  if(fechado(x.data)) return toast('Dia fechado. Reabra para editar.', true);
  await ensureMonth(x.data.slice(0, 7));
  const sid = pkSlotId(k, a.n, rep), id = regId(x.data, sid);
  if(!st){ delete S.regs[id]; return persist(() => S.store.del('regs', id)); }
  if(st === 'dada' && x.data > hojeStr()) return toast('Essa aula ainda não aconteceu.', true);
  const cur = S.regs[id];
  const reg = {id, data:x.data, slotId:sid, turmaId:'pk_' + k.id, profId:k.profId, titulo:'VIP · ' + k.aluno, inicio:x.inicio, fim:x.fim, minutos:toMin(x.fim) - toMin(x.inicio), status:st, substitutoId:null, motivo:null};
  S.regs[id] = reg;
  return persist(() => S.store.put('regs', reg));
}

const VTILE_IC = {dada:'dada', cancelada:'cancelada', perdida:'cancelada', agendada:'calendario', amarcar:'mais'};
function vTile(k, a){

function vRow(k){
  const r = pkResumo(k), p = prof(k.profId);
  const ps = n => n === 1 ? '' : 's';

function pfNovo(base){
  const leo = activeProfs().find(p => /^le[oó]$/i.test(p.nome)) || activeProfs()[0];
  return Object.assign({step:1, aluno:'', tel:'', profId:leo ? leo.id : '', total:8, dias:[], hora:'', dur:60, ini:addDays(hojeStr(), 1), datas:null, pulos:[], edit:null, done:null}, base || {});
}
function pfCheck(f, i){
  const x = f.datas[i], sa = diaSemAula(x.d);
  if(sa) return {ok:false, msg:sa.nome};
  const bate = ocupado(f.profId, x.d).find(o => toMin(o.ini) < toMin(x.fim) && toMin(o.fim) > toMin(x.inicio));
  if(bate) return {ok:false, msg:`${(prof(f.profId) || {}).nome} ocupado (${bate.txt})`};
  if(f.datas.some((y, j) => j !== i && y.d === x.d && toMin(y.inicio) < toMin(x.fim) && toMin(y.fim) > toMin(x.inicio))) return {ok:false, msg:'Mesmo horário de outra aula do pacote'};
  if(parse(x.d).getDay() === 0) return {ok:false, msg:'Domingo'};
  return {ok:true, msg:`${(prof(f.profId) || {}).nome} livre`};
}
async function pfGerar(){
  const f = S.pf, out = [], pulos = [], fim = fmtMin(toMin(f.hora) + f.dur);
  let d = f.ini, g = 0;
  while(out.length < f.total && g++ < 600){
    if(f.dias.includes(parse(d).getDay())){
      await ensureMonth(d.slice(0, 7));
      const sa = diaSemAula(d);
      if(sa) pulos.push({d, motivo:sa.nome});
      else {
        const bate = ocupado(f.profId, d).find(o => toMin(o.ini) < toMin(fim) && toMin(o.fim) > toMin(f.hora));
        if(bate) pulos.push({d, motivo:`${(prof(f.profId) || {}).nome} ocupado (${bate.txt})`}); else out.push({d, inicio:f.hora, fim});
      }
    }
    d = addDays(d, 1);
  }
  f.datas = out; f.pulos = pulos.filter(p => out.length && p.d < out[out.length - 1].d);
}

  return `<div class="pagehead"><h2>Novo pacote</h2></div><div class="vsteps">${steps}</div><div class="vf">${body}</div>`;

    <label>Professor</label><div class="chips">${activeProfs().map(x => `<button class="chip ${x.id === t.profId ? 'on' : ''}" data-a="v-ed-prof" data-p="${x.id}">${avatar(x, 22)}${esc(x.nome)}</button>`).join('')}</div>
    <p class="note" style="max-width:none;margin-top:10px">Ao trocar o professor, as aulas que ainda não foram conferidas passam para ele. As já lançadas ficam com quem deu.</p>
